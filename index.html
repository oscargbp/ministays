<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUB Ministays</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EBEEF3; --ink:#1B2333; --muted:#5B6577; --line:#DCE1E9;
  --brand:#24407A; --brand-ink:#FFFFFF; --brand-soft:#E4EAF6;
  --ok:#2F8F5B; --ok-bg:#E1F2E8; --no:#C4473A; --no-bg:#F8E2DF; --wait:#A8740C; --wait-bg:#FBEFD2; --none:#8A93A3; --none-bg:#EEF0F4;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11161F; --surface:#18202C; --sunk:#0F141C; --ink:#E5E9F0; --muted:#9AA5B7; --line:#2A3445;
    --brand:#8EA9E6; --brand-ink:#0F1726; --brand-soft:#1F2A40;
    --ok:#5CC28A; --ok-bg:#15301F; --no:#EE8173; --no-bg:#3A1C19; --wait:#E7B550; --wait-bg:#382B0F; --none:#7D879A; --none-bg:#222B3A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;display:grid;grid-template-columns:232px 1fr}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo svg,.logo .escudo{flex:none}
.logo .escudo{height:36px;width:auto}
.logo b{font-family:var(--display);font-size:17px;line-height:1.1;display:block;font-weight:800;letter-spacing:-.01em}
.logo small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;color:var(--muted);font-weight:700}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav-btn .count{margin-left:auto;background:var(--no);color:#fff;font-size:12px;border-radius:20px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.side-foot button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
.side-foot button:hover{background:var(--sunk);color:var(--ink)}
.saved{padding:6px 10px;color:var(--muted);font-size:12.5px}

/* Main */
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.head h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--no);border-color:transparent;background:none}
.btn.danger[data-armed]{background:var(--no);color:#fff}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.section-title{font-size:19px;font-weight:700;margin:30px 0 12px}
.muted{color:var(--muted)}
.empty{padding:36px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}

/* Week bar & summary */
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar strong{font-family:var(--display);font-size:17px;min-width:170px;text-align:center}
.summary{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.summary div{flex:1 1 150px;padding:14px 18px;border-right:1px solid var(--line)}
.summary div:last-child{border-right:0}
.summary b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
.summary span{color:var(--muted);font-size:13.5px}
.summary .alert b{color:var(--no)}

/* House board — the signature element */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 16px;margin-top:6px}
.house{--c:var(--none);--cbg:var(--none-bg);cursor:pointer;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.house[data-s="yes"]{--c:var(--ok);--cbg:var(--ok-bg)}
.house[data-s="no"]{--c:var(--no);--cbg:var(--no-bg)}
.house[data-s="pending"]{--c:var(--wait);--cbg:var(--wait-bg)}
.roof{height:30px;background:var(--c);clip-path:polygon(0 100%,50% 0,100% 100%);margin:0 -6px}
.wall{background:var(--surface);border:2px solid var(--c);border-top:0;border-radius:0 0 10px 10px;padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:8px}
.house:hover .wall{background:var(--cbg)}
.house h3{font-size:16.5px;font-weight:700}
.state{font-size:13px;font-weight:700;color:var(--c)}
.windows{display:flex;gap:6px;flex-wrap:wrap}
.win{width:22px;height:22px;border-radius:4px;border:2px solid var(--c);background:transparent}
.win.on{background:var(--c)}
.guests{font-size:13.5px;color:var(--muted);min-height:20px}
.guests b{color:var(--ink);font-weight:700}

/* Alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--no);border-radius:8px;padding:10px 14px;flex-wrap:wrap}
.alert-item.warn{border-left-color:var(--wait)}
.alert-item.info{border-left-color:var(--brand)}
.alert-item p{margin:0}
.alert-item small{color:var(--muted);display:block}

/* Lists */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1 1 240px;max-width:380px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(180px,1.3fr) 2fr auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.item .name:hover{color:var(--brand);text-decoration:underline}
.item .sub{font-size:13.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12.5px;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.red{background:var(--no-bg);color:var(--no)}
.tag.green{background:var(--ok-bg);color:var(--ok)}
.tag.amber{background:var(--wait-bg);color:var(--wait)}
.tag.blue{background:var(--brand-soft);color:var(--brand)}

/* Availability grid */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;min-width:760px}
.grid th,.grid td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.grid tr:last-child td{border-bottom:0}
.grid th{font-size:13px;color:var(--muted);font-weight:700;padding:10px 6px}
.grid th.now{color:var(--brand)}
.grid td.fam{text-align:left;padding-left:14px;white-space:nowrap}
.grid td.fam b{display:block}
.grid td.fam small{color:var(--muted)}
.cell{width:100%;min-width:74px;height:44px;border-radius:7px;border:1.5px solid transparent;cursor:pointer;font-size:12.5px;font-weight:700;background:var(--none-bg);color:var(--none)}
.cell[data-s="yes"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.cell[data-s="no"]{background:var(--no-bg);color:var(--no);border-color:var(--no)}
.cell[data-s="pending"]{background:var(--wait-bg);color:var(--wait);border-color:var(--wait);border-style:dashed}
.cell .occ{display:block;font-weight:400;font-size:11.5px}

/* Assign view */
.assign{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.stu-list{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;max-height:72vh;overflow:auto}
.stu-btn{display:flex;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.stu-btn:hover{background:var(--sunk)}
.stu-btn[aria-current="true"]{background:var(--brand-soft)}
.stu-btn small{display:block;color:var(--muted);font-size:12.5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--no)}
.dot.ok{background:var(--ok)}
.stu-card h2{font-size:24px;font-weight:800}
.current{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cands{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center}
.score{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:conic-gradient(var(--sc) calc(var(--v)*1%),var(--sunk) 0);position:relative}
.score::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.score span{position:relative}
.cand h3{font-size:16.5px}
.reasons{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.reasons .p{color:var(--ok)} .reasons .c{color:var(--wait)}
details.excluded{margin-top:16px}
details.excluded summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 0}
.ex-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ex-item:last-child{border-bottom:0}

/* Modal */
dialog{border:0;border-radius:14px;padding:0;width:min(680px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(15,22,35,.5)}
.m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.m-head h2{font-size:21px}
.m-body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;max-height:68vh;overflow:auto}
.m-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700}
.f.full{grid-column:1/-1}
.f input:not([type=checkbox]),.f select,.f textarea{font-weight:400;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:400}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.err{grid-column:1/-1;color:var(--no);font-weight:700;margin:0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* Cuadro de mando */
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{font-size:17px;font-weight:700}
.card .desc{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.card .key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.card .key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.cols-wrap{overflow-x:auto}
.cols{display:flex;align-items:stretch;gap:6px;height:190px;min-width:min-content}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px}
.col .area{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.col .v{font-size:12px;font-weight:700;color:var(--muted);height:16px}
.col .v.bad{color:var(--no)}
.col .l{font-size:11.5px;color:var(--muted);white-space:nowrap}
.col .l.now{color:var(--brand);font-weight:700}
.stack{width:100%;max-width:36px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;min-height:2px;background:var(--sunk)}
.bar{width:45%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(90px,140px) 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.hrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow b{text-align:right}
.track{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;display:flex}
.track div{height:100%}
.ring{--v:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--no-bg) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-family:var(--display);font-weight:800;font-size:26px}
.ring-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring-row ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .mini{width:90px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.tbl .mini div{height:100%;background:var(--brand)}
.tbl-wrap{overflow-x:auto}
.link{border:0;background:none;padding:0;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
.link:hover{color:var(--brand);text-decoration:underline}

/* Correo */
.mail-meta{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;font-size:14px;align-items:center;margin-bottom:12px}
.mail-meta span{color:var(--muted);font-weight:700}
.mail-body{width:100%;min-height:300px;font-family:var(--body);font-size:14.5px;line-height:1.55;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vars code{font-size:12px;background:var(--sunk);padding:2px 6px;border-radius:5px;cursor:pointer;border:0;color:var(--ink)}
.notice{padding:10px 14px;border-radius:8px;background:var(--brand-soft);color:var(--ink);font-size:14px;margin-bottom:12px}
.notice.warn{background:var(--wait-bg)}

/* Tutores y valoraciones */
:root{--star:#D99A1E}
@media (prefers-color-scheme:dark){:root{--star:#F0BE55}}
.stars{white-space:nowrap;letter-spacing:1px}
.stars span{color:var(--line)}
.stars .on{color:var(--star)}
.stars small{color:var(--muted);margin-left:5px;letter-spacing:0;font-size:12.5px}
.star-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.star-row b{display:block}
.star-row small{color:var(--muted);font-weight:400}
.star-btns{display:flex}
.star-btn{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--line);padding:2px 3px}
.star-btn.on{color:var(--star)}
.star-btn:hover{transform:scale(1.12)}
.tutor-box{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--sunk);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tutor-box select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.review{padding:12px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.review p{margin:4px 0 0;font-size:14px}

@media (max-width:860px){
  .star-row{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
  body{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;padding:14px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;overflow-x:auto}
  .nav-btn{white-space:nowrap}
  .side-foot{flex-direction:row;flex-wrap:wrap;margin:0}
  .assign{grid-template-columns:1fr}
  .stu-list{max-height:240px}
  .item{grid-template-columns:1fr;gap:8px}
  .m-body{grid-template-columns:1fr}
  .cand{grid-template-columns:56px 1fr}
  .cand .btn{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lang{display:flex;flex-direction:column;gap:6px}
.lang .seg{margin:0 8px}
.lang .seg button{flex:1;padding:6px 10px;font-size:13.5px}
@media (max-width:860px){.lang{flex-direction:row;align-items:center}}
/* Periodos, tramos y línea de tiempo */
.range-row{display:grid;grid-template-columns:1fr 1fr 1.2fr 70px 36px;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.range-row.bad input{border-color:var(--no)!important}
.range-days{font-size:13px;color:var(--muted);padding-bottom:9px;white-space:nowrap}
.range-days.bad{color:var(--no);font-weight:700}
.tl{padding:14px 16px;overflow-x:auto}
.tl-row{display:grid;grid-template-columns:170px minmax(560px,1fr);gap:12px;align-items:center;padding:4px 0}
.tl-months{position:relative;height:22px;font-size:12.5px;color:var(--muted);text-transform:capitalize}
.tl-track{position:relative;height:30px;background:var(--sunk);border-radius:6px;overflow:hidden}
.tl-track.periods{height:34px;background:none;border-bottom:1px solid var(--line);border-radius:0}
.tl-period{position:absolute;height:14px;background:var(--brand-soft);border:1.5px solid var(--brand);border-radius:4px;font-size:10.5px;line-height:11px;padding:0 4px;color:var(--brand);overflow:hidden;white-space:nowrap;font-weight:700}

<!--santi-app:inicio-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Encode+Sans+Semi+Expanded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="santi-app">
/* ministays · base del estilo «Data Hub» para aplicaciones (SEK Education Group)
   Tokens, fondo, tipografía e iconos animados. Es lo único que se inyecta al adaptar una app existente.
   Los tokens y los iconos vienen tal cual de santi-pres; lo marcado «+» es propio de las apps. */
:root{
  --void:#070b14; --panel:#0d1322; --panel-2:#131b2e; --line:#1c2538; --line-2:#2a3552;
  --c1:#3fc8e4; --c1-rgb:63,200,228;   /* frío: lo que entra, el dato en bruto */
  --c2:#5b8cff; --c2-rgb:91,140,255;
  --c3:#a17dff; --c3-rgb:161,125,255;
  --c4:#ffb547; --c4-rgb:255,181,71;   /* cálido: el valor, la decisión, lo que sale */
  --s:var(--c2); --srgb:var(--c2-rgb);
  --spectrum:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));
  --glow:rgba(var(--srgb),.35);
  --ext:#56607a; --ext-bg:#0a0f1b;
  --hi:#eef2fa; --mid:#b9c1d3; --lo:#8a93a8;
  --future:#4ade80; --future-rgb:74,222,128; --future-bg:rgba(74,222,128,.08);
  --go:#4ade80; --go-rgb:74,222,128; --wait:#ffb547; --wait-rgb:255,181,71; --stop:#ff5d73; --stop-rgb:255,93,115;
  --head:'Encode Sans Semi Expanded','Segoe UI',sans-serif;
  --body:'Encode Sans','Segoe UI',sans-serif;
  /* + propios de app */
  --field:#0a1020; --radius:14px; --radius-lg:18px;
  color-scheme:dark;
}
.s1,[data-v="1"]{--s:var(--c1);--srgb:var(--c1-rgb)}
.s2,[data-v="2"]{--s:var(--c2);--srgb:var(--c2-rgb)}
.s3,[data-v="3"]{--s:var(--c3);--srgb:var(--c3-rgb)}
.s4,[data-v="4"]{--s:var(--c4);--srgb:var(--c4-rgb)}
.sg,[data-v="go"]{--s:var(--go);--srgb:var(--go-rgb)}
.sw,[data-v="wait"]{--s:var(--wait);--srgb:var(--wait-rgb)}
.sx,[data-v="stop"]{--s:var(--stop);--srgb:var(--stop-rgb)}

/* + base: a diferencia del deck, la app hace scroll */
html,body{background:var(--void);color:var(--hi);font-family:var(--body)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 35%,#000 30%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 30%,transparent 85%)}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:2px;background:var(--spectrum);box-shadow:0 0 12px rgba(91,140,255,.35);z-index:60;pointer-events:none}
::selection{background:rgba(var(--c2-rgb),.35);color:var(--hi)}
:focus-visible{outline:2px solid var(--s);outline-offset:2px}
*{scrollbar-color:var(--line-2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:2px solid var(--void)}::-webkit-scrollbar-track{background:transparent}
input,select,textarea{color-scheme:dark}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
.kicker{font-size:12.5px;font-weight:700;color:var(--c1);letter-spacing:.14em;margin:0 0 10px;text-transform:uppercase}
.kicker.acc{color:var(--s)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- iconos animados (svg.ai, viewBox 0 0 64 64) ---------- */
.ai{width:76px;height:76px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ai .teeth{stroke-linecap:butt}
.ai g,.ai .bar{transform-box:fill-box;transform-origin:center}
.a-drop{animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}70%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.a-g1{animation:spin 6s linear infinite}
.a-g2{animation:spin 4s linear infinite reverse}
.ai .badge{fill:var(--panel);stroke:var(--s)}
.a-badge{animation:badge 4s ease-in-out infinite}
@keyframes badge{0%,18%{transform:scale(0);opacity:0}28%{transform:scale(1.15);opacity:1}34%,86%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}
.a-badge .a-tick{stroke-dasharray:16;stroke-dashoffset:16;animation:tick 4s ease-in-out infinite}
@keyframes tick{0%,30%{stroke-dashoffset:16}45%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.ai .bar{fill:rgba(var(--srgb),.85);stroke:none;transform-origin:bottom;animation:bar 2.4s ease-in-out infinite alternate}
.ai .b2{animation-delay:-.8s}.ai .b3{animation-delay:-1.6s}
@keyframes bar{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
.ai .occ{fill:#0e1628}
.a-ghost{animation:ghost 3s ease-in-out infinite}
@keyframes ghost{0%{transform:translate(-12px,8px);opacity:0}35%,80%{transform:none;opacity:.9}100%{transform:none;opacity:0}}
.a-pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(var(--srgb),0))}50%{filter:drop-shadow(0 0 6px rgba(var(--srgb),.9))}}
.ai .a-tick{stroke-dasharray:28;stroke-dashoffset:28;animation:tick2 3s ease-in-out infinite}
@keyframes tick2{0%,15%{stroke-dashoffset:28}45%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.a-float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(2px) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
.ly1{animation:lyUp 2.6s ease-in-out infinite}.ly3{animation:lyDown 2.6s ease-in-out infinite}
@keyframes lyUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes lyDown{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.a-shackle{animation:shackle 2.8s ease-in-out infinite}
@keyframes shackle{0%,15%{transform:translateY(-6px)}35%,85%{transform:translateY(0)}100%{transform:translateY(-6px)}}
.a-line{stroke-dasharray:60;stroke-dashoffset:60;animation:line 3s ease-in-out infinite}
.a-head{opacity:0;animation:head 3s ease-in-out infinite}
@keyframes line{0%{stroke-dashoffset:60}50%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes head{0%,45%{opacity:0}55%,85%{opacity:1}100%{opacity:0}}
.a-plugL{animation:plugL 2.6s ease-in-out infinite}.a-plugR{animation:plugR 2.6s ease-in-out infinite}
@keyframes plugL{0%,100%{transform:translateX(-5px)}40%,75%{transform:translateX(0)}}
@keyframes plugR{0%,100%{transform:translateX(5px)}40%,75%{transform:translateX(0)}}
.ai .a-spark{fill:var(--s);stroke:none;opacity:0;animation:spark 2.6s ease-in-out infinite}
@keyframes spark{0%,38%{opacity:0;transform:scale(.4)}48%{opacity:1;transform:scale(1.4)}70%{opacity:0;transform:scale(1)}100%{opacity:0}}
.ai .ck{stroke-dasharray:12;stroke-dashoffset:12;animation:ck 3.6s ease-in-out infinite}
.ai .c2{animation-delay:.35s}.ai .c3{animation-delay:.7s}
@keyframes ck{0%,10%{stroke-dashoffset:12}30%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.ai .dotc{fill:var(--s);stroke:none}
.ai .a-ripple{animation:ripple 2.4s ease-out infinite}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.9);opacity:0}}
.ai .tl{fill:rgba(var(--srgb),.08);animation:tile 3.2s ease-in-out infinite}
.ai .t2{animation-delay:.4s}.ai .t3{animation-delay:.8s}.ai .t4{animation-delay:1.2s}
@keyframes tile{0%,100%{fill:rgba(var(--srgb),.06)}30%{fill:rgba(var(--srgb),.75)}55%{fill:rgba(var(--srgb),.06)}}
/* + iconos de la skill */
.a-shake{animation:shake 3s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}85%{transform:rotate(-5deg)}90%{transform:rotate(0)}}
.a-blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

@media print{

}

/* ===== mapa: generico ===== */
/* ministays · mapa GENÉRICO para adaptar una app existente
   Traduce los nombres de token más habituales al estilo Data Hub. Va después de santi-base.css
   y después del CSS de la app, así que gana a sus :root (también a los de @media prefers-color-scheme). */
:root{
  /* fondos y superficies */
  --bg:var(--void); --background:var(--void); --page:var(--void);
  --surface:var(--panel); --card:var(--panel); --panel-bg:var(--panel); --surface-2:var(--panel-2); --sunk:#0a1020; --muted-bg:var(--panel-2);
  /* texto */
  --text:var(--hi); --ink:var(--hi); --fg:var(--hi); --foreground:var(--hi); --muted:var(--lo); --text-muted:var(--lo); --subtle:var(--lo);
  /* bordes */
  --border:var(--line); --line-strong:var(--line-2);
  /* marca y acento: azul del espectro */
  --brand:var(--c2); --primary:var(--c2); --accent:var(--c2); --brand-ink:var(--void); --primary-ink:var(--void); --on-primary:var(--void);
  --brand-soft:rgba(91,140,255,.14); --accent-soft:rgba(91,140,255,.14);
  /* estados: semáforo */
  --ok:var(--go); --success:var(--go); --green:var(--go); --ok-bg:rgba(74,222,128,.12); --success-bg:rgba(74,222,128,.12);
  --warn:var(--wait); --warning:var(--wait); --amber:var(--wait); --wait-bg:rgba(255,181,71,.12); --warn-bg:rgba(255,181,71,.12);
  --no:var(--stop); --danger:var(--stop); --error:var(--stop); --red:var(--stop); --no-bg:rgba(255,93,115,.12); --danger-bg:rgba(255,93,115,.12);
  /* tipografía */
  --display:var(--head); --heading:var(--head); --font-head:var(--head); --font-body:var(--body); --font:var(--body);
  color-scheme:dark;
}
/* elementos sueltos, con especificidad baja para no pisar componentes */
:where(h1,h2,h3){font-family:var(--head)}
:where(input,select,textarea){background:var(--field);color:var(--hi);border-color:var(--line-2)}
:where(input,select,textarea):focus{border-color:var(--s);box-shadow:0 0 0 3px rgba(var(--srgb),.18);outline:none}
:where(dialog){background:var(--panel);color:var(--hi);border:1px solid var(--line-2)}
:where(dialog)::backdrop{background:rgba(7,11,20,.72);backdrop-filter:blur(3px)}
:where(table) :where(th){color:var(--lo);letter-spacing:.08em}

/* cada sección del menú toma su color del espectro: 1 entra · 2 gestionar · 3 analizar · 4 decidir */
.nav-btn[data-id="solicitudes"],.nav-btn[data-id="grupos"],.nav-btn[data-id="disponibilidad"],.nav-btn[data-id="admin"]{--s:var(--c1);--srgb:var(--c1-rgb)}

.nav-btn[data-id="mando"],.nav-btn[data-id="historico"],.nav-btn[data-id="tutores"]{--s:var(--c3);--srgb:var(--c3-rgb)}
.nav-btn[data-id="asignar"]{--s:var(--c4);--srgb:var(--c4-rgb)}

.nav-btn{position:relative;color:var(--mid)}
.nav-btn:hover{background:var(--panel-2);color:var(--hi)}
.nav-btn[aria-current="page"]{color:var(--hi);background:rgba(var(--srgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--srgb),.35)}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--s);box-shadow:0 0 12px rgba(var(--srgb),.8)}
.nav-btn .count{background:var(--stop);color:var(--void);box-shadow:0 0 12px rgba(var(--stop-rgb),.45)}
/* titulares y cifras */
.head h1{font-weight:800;letter-spacing:-.02em}
.summary,.panel,.card,.list,.grid-wrap,.cand,.stu-list,.tl{background:var(--panel);border-color:var(--line)}
.summary b{font-family:var(--head);font-weight:800}
.summary .alert b{color:var(--stop);text-shadow:0 0 18px rgba(var(--stop-rgb),.35)}
.section-title{font-family:var(--head)}
/* botones en píldora, el principal con brillo */
.btn{border-radius:999px;border-color:rgba(var(--c2-rgb),.5);background:rgba(var(--c2-rgb),.1);color:var(--hi)}
.btn:hover{background:rgba(var(--c2-rgb),.2);border-color:rgba(var(--c2-rgb),.7)}
.btn.primary{background:var(--c2);border-color:var(--c2);color:var(--void);box-shadow:0 0 20px rgba(var(--c2-rgb),.35)}
.btn.danger{background:transparent;color:var(--stop);border-color:rgba(var(--stop-rgb),.5)}
.icon-btn{background:var(--panel);border-color:var(--line-2)}
.seg{background:var(--panel);border-color:var(--line)}
.seg button[aria-pressed="true"]{background:rgba(var(--c2-rgb),.18);color:var(--hi);box-shadow:inset 0 0 0 1px rgba(var(--c2-rgb),.5)}
/* campos */
.f input:not([type=checkbox]),.f select,.f textarea,.search,.mail-body,.kid-row input,.kid-row select,.tutor-box select{background:var(--field);border-color:var(--line-2);color:var(--hi)}
.m-body .sec{color:var(--c1);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
/* etiquetas */
.tag{border:1px solid var(--line-2);background:var(--panel-2);color:var(--mid)}
.tag.green{border-color:rgba(var(--go-rgb),.45)} .tag.red{border-color:rgba(var(--stop-rgb),.45)} .tag.amber{border-color:rgba(var(--wait-rgb),.45)}
.tag.blue{background:rgba(var(--c2-rgb),.12);border-color:rgba(var(--c2-rgb),.45);color:var(--hi)}
/* casas del panel: el tejado brilla con su estado */
.house .roof{filter:drop-shadow(0 -2px 10px var(--c))}
.house .wall{background:var(--panel)}
.win.on{box-shadow:0 0 8px var(--c)}
/* gráficos: barras con brillo */
.track > div,.stack > div,.bar{box-shadow:0 0 10px rgba(var(--c2-rgb),.35)}
.ring{background:conic-gradient(var(--go) calc(var(--v)*1%),rgba(var(--stop-rgb),.18) 0)}
.ring::before,.score::before{background:var(--panel)}
.tl-period{background:rgba(var(--c2-rgb),.14)}
/* ventanas y avisos */
dialog{background:var(--panel);border:1px solid var(--line-2);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(91,140,255,.12)}
.toast{background:var(--panel-2);color:var(--hi);border:1px solid rgba(var(--c2-rgb),.5);box-shadow:0 0 26px rgba(var(--c2-rgb),.25)}
.notice{background:rgba(var(--c2-rgb),.08);border:1px solid rgba(var(--c2-rgb),.35)}
.notice.warn{background:rgba(var(--wait-rgb),.08);border-color:rgba(var(--wait-rgb),.4)}
.alert-item{background:var(--panel);border-top-color:var(--line);border-right-color:var(--line);border-bottom-color:var(--line)}
.empty{border-color:var(--line-2);background:rgba(13,19,34,.6)}

</style>
<!--santi-app:fin-->

const pad = n => String(n).padStart(2,'0');

const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = v => { const d = typeof v === 'string' ? parse(v) : new Date(v.getFullYear(),v.getMonth(),v.getDate()); return toKey(addDays(d, -((d.getDay()+6)%7))); };
const todayKey = () => toKey(new Date());

  return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${monShort(b)}` : `${fmt(w)} – ${fmt(toKey(b))}`; };
function stayWeeks(st){
  if(!st.arrival || !st.departure) return [];
  let d = parse(st.arrival), end = parse(st.departure);
  if(end <= d) end = addDays(d,1);
  const s = new Set();
  while(d < end){ s.add(mondayOf(d)); d = addDays(d,1); }
  return [...s];
}

  } else if(localOK()){
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    store = 'local';
    if(canShare() && lsGet(MODE_KEY)==='shared'){
      try{ dirHandle = await idb('get'); }catch(e){ dirHandle = null; }

/* ================= Periodos y disponibilidad ================= */
const daysIncl = (a,b) => Math.round((parse(b)-parse(a))/864e5) + 1;
const periodById = id => (state.periods||[]).find(p=>p.id===id);
const periodsSorted = () => [...(state.periods||[])].sort((a,b)=>a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
const periodLabel = p => `${p.name} · ${fmt(p.start)} – ${fmt(p.end)}`;
const periodSpan = p => ({arrival:p.start, departure:p.end});
const isContiguous = (p,q) => q.id!==p.id && q.start>p.start && q.end>p.end && q.start<=toKey(addDays(parse(p.end),1));
const nextContiguous = p => periodsSorted().find(q=>isContiguous(p,q));
function stayDates(st){
  const p = periodById(st.periodId); if(!p) return null;
  const q = st.extendPeriodId && periodById(st.extendPeriodId);
  return {arrival:p.start, departure:(q && isContiguous(p,q)) ? q.end : p.end};
}
function syncStays(){
  let dropped = 0;
  state.students.forEach(s=>{
    const p = periodById(s.periodId); if(!p) return;
    if(s.extendPeriodId){ const q = periodById(s.extendPeriodId); if(!q || !isContiguous(p,q)){ delete s.extendPeriodId; dropped++; } }
    const d = stayDates(s); s.arrival = d.arrival; s.departure = d.departure;
    if(s.dob) s.age = ageAt(s.dob, s.arrival);
  });
  (state.monitors||[]).forEach(m=>{ const p = periodById(m.periodId); if(p){ m.arrival = p.start; m.departure = p.end; } if(m.dob) m.age = ageAt(m.dob, m.arrival); });
  return dropped;
}
function mergeRanges(list){
  const out = [];
  [...list].sort((a,b)=>a.from.localeCompare(b.from)).forEach(r=>{
    const last = out[out.length-1];
    if(last && r.from <= toKey(addDays(parse(last.to),1))){ if(r.to > last.to) last.to = r.to; }
    else out.push({from:r.from, to:r.to});
  });
  return out;
}
/* 'yes' = un tramo confirmado cubre todas las fechas · 'pending' = solo se cubre contando tramos pendientes
   'partial' = solapa pero no cubre · 'no' = sin disponibilidad en esas fechas */
function coverage(f, from, to){
  const r = f.ranges || [];
  const covers = m => m.some(x=>x.from<=from && x.to>=to);
  if(covers(mergeRanges(r.filter(x=>x.status==='yes')))) return 'yes';
  if(covers(mergeRanges(r))) return 'pending';
  if(r.some(x=>x.from<=to && x.to>=from)) return 'partial';
  return 'no';
}
const famStatus = (f,p) => coverage(f, p.start, p.end);
const occupants = (f,p) => allGuests().filter(s => s.familyId===f.id && overlaps(s, periodSpan(p)));

const covLabel = k => ({yes:t('Encaja'), pending:t('Pendiente de confirmar'), partial:t('Encaja en parte'), no:t('Sin disponibilidad')})[k];
function currentPeriodId(){
  const ps = periodsSorted(); if(!ps.length) return null;
  const d = todayKey();
  return (ps.find(p=>p.start<=d && p.end>=d) || ps.find(p=>p.start>d) || ps[ps.length-1]).id;
}
/* ---- Nombre y apellidos ---- */
const PARTICLES = new Set(['de','del','la','las','los','y','san','santa','da','do','dos','van','von','der','di','le','mc','mac']);
function splitName(full){
  const w = String(full||'').trim().split(/\s+/).filter(Boolean);
  if(w.length<=1) return {firstName:w[0]||'', lastName:'', auto:false};
  if(w.length===2) return {firstName:w[0], lastName:w[1], auto:false};
  let i = w.length-2;                                   // dos apellidos al final
  while(i-1>=1 && PARTICLES.has(norm(w[i-1]))) i--;     // «De Miguel», «Del Palacio», «De la Fuente»
  return {firstName:w.slice(0,i).join(' '), lastName:w.slice(i).join(' '), auto:true};
}
const joinName = (f, l) => [f, l].map(x=>String(x||'').trim()).filter(Boolean).join(' ');
function ensureNames(x){
  if(x.firstName===undefined && x.lastName===undefined){ const sp = splitName(x.name); x.firstName = sp.firstName; x.lastName = sp.lastName; if(sp.auto) x.nameAuto = true; return true; }
  const full = joinName(x.firstName, x.lastName); if(full && full!==x.name){ x.name = full; return true; }
  return false;
}
const nameFields = (pre, x, req) => `<label class="f">${t('Nombre')}<input id="${pre}_first" value="${esc(x.firstName ?? splitName(x.name).firstName)}" autocomplete="off"></label>
    <label class="f">${t('Apellidos')}<input id="${pre}_last" value="${esc(x.lastName ?? splitName(x.name).lastName)}" autocomplete="off">${x.nameAuto?`<span class="hint" style="color:var(--wait)">${t('Separado automáticamente: compruébalo')}</span>`:''}</label>`;
function migrate(){
  let changed = false;
  state.periods = state.periods || [];
  state.families.forEach(f=>{
    if(!Array.isArray(f.ranges)){
      f.ranges = []; let cur = null;
      Object.entries(f.availability||{}).filter(([,v])=>v==='yes'||v==='pending').sort((a,b)=>a[0].localeCompare(b[0])).forEach(([w,v])=>{
        const to = toKey(addDays(parse(w),6));
        if(cur && cur.status===v && w===toKey(addDays(parse(cur.to),1))) cur.to = to;
        else { cur = {id:uid(), from:w, to, status:v}; f.ranges.push(cur); }
      });
      changed = true;
    }
    if(f.availability){ delete f.availability; changed = true; }
  });
  state.students.forEach(s=>{
    if(s.periodId && periodById(s.periodId)) return;
    if(!s.arrival || !s.departure) return;
    let p = state.periods.find(x=>x.start===s.arrival && x.end===s.departure);
    if(!p){ p = {id:uid(), name:t('Periodo del {d}',{d:fmtY(s.arrival)}), start:s.arrival, end:s.departure, expected:'', notes:''}; state.periods.push(p); }
    s.periodId = p.id; changed = true;
  });
  [...state.students, ...(state.monitors||[]), ...(state.tutors||[])].forEach(x=>{ if(ensureNames(x)) changed = true; });
  return changed;
}

/* ================= Compatibilidad y valoraciones ================= */
const fmt1 = v => lang==='en' ? v.toFixed(1) : v.toFixed(1).replace('.',',');
const reviewAvg = r => { const v = ASPECTS().map(([k])=>r&&r.scores?r.scores[k]:0).filter(Boolean); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; };
function famRating(fid){
  const revs = state.students.filter(s=>s.familyId===fid && s.review);
  const per = {}; ASPECTS().forEach(([k])=>{ const v = revs.map(s=>s.review.scores[k]).filter(Boolean); per[k] = v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; });
  return {n:revs.length, avg:revs.length ? revs.reduce((a,s)=>a+reviewAvg(s.review),0)/revs.length : 0, per, revs};
}
function starsHTML(v, extra=''){
  if(!v) return `<span class="muted">${t('Sin valorar')}</span>`;
  return `<span class="stars" role="img" aria-label="${t('{v} de 5 estrellas',{v:fmt1(v)})}">${[1,2,3,4,5].map(i=>`<span class="${i<=Math.round(v)?'on':''}">★</span>`).join('')}<small>${fmt1(v)}${extra}</small></span>`;
}
function evaluate(st, f){
  const blocks = [], pros = [], cons = [];
  let score = 50;
  const cov = coverage(f, st.arrival, st.departure);
  if(cov==='no') blocks.push(t('No tiene disponibilidad en esas fechas'));
  else if(cov==='partial') blocks.push(t('Su disponibilidad no cubre toda la estancia'));
  else if(cov==='yes'){ score += 15; pros.push(t('Disponible toda la estancia')); }
  else { score -= 10; cons.push(t('Fechas pendientes de confirmar')); }

  const busy = allGuests().filter(o => o.id!==st.id && o.familyId===f.id && overlaps(o,st)).length;
  const mb = monitorBlockFor(st, f); if(mb) blocks.push(mb);
  if(f.stayType && f.stayType!=='ambas' && !f.isResidence){ const stt = st.stayType||'mini';
    if(f.stayType===stt){ score += 5; pros.push(stt==='full'?t('Prefiere alumnos Full Year'):t('Prefiere Ministays')); }
    else { score -= 15; cons.push(f.stayType==='full'?t('La familia prefiere alumnos Full Year'):t('La familia prefiere Ministays')); } }
  const myMon = (state.monitors||[]).filter(m=>m.familyId===f.id && overlaps(m,st) && sameParty(m, st));
  if(myMon.length){ score += 5; pros.push(t('Su monitor se aloja en esta familia')); }
  companions(st).filter(c=>c.id!==st.id).forEach(c=>{ if(c.familyId===f.id){ score += 15; pros.push(t('Con su compañero/a {n}',{n:c.name})); }
    else if(c.familyId){ score -= 10; cons.push(t('Su compañero/a {n} está en la familia {f}',{n:c.name, f:famById(c.familyId)?.name||''})); } });
  const cap = Number(f.capacity)||1;
  if(busy >= cap) blocks.push(t('Sin plazas libres ({b}/{c} ocupadas)',{b:busy,c:cap}));
  else if(busy > 0) cons.push(pl(busy, t('Comparte casa con {n} estudiante'), t('Comparte casa con {n} estudiantes')));

  if(st.petAllergy && f.pets){
    const types = f.petTypes||[], onlyOther = types.length && types.every(x=>x==='otros');
    if(onlyOther || f.petWhere==='fuera') cons.push(t('Mascotas que no conviven dentro de casa') + (f.petsDesc ? ` (${f.petsDesc})` : ''));
    else if(f.petWhere==='apartada'){ score -= 10; cons.push(t('Mascotas que pueden mantenerse apartadas: confirmar con la familia')); }
    else blocks.push(t('Tiene mascotas y el estudiante es alérgico') + (f.petsDesc ? ` (${f.petsDesc})` : ''));
  }
  if(st.diet && st.diet!=='ninguna' && !(f.diets||[]).includes(st.diet)) blocks.push(t('No ofrece dieta {d}',{d:dietLabel(st.diet)}));
  const sl = smokeLevel(f);
  if(st.smokeFree && sl==='dentro') blocks.push(t('Hay fumadores en casa'));
  else if(st.smokeFree && sl==='fuera') cons.push(t('Alguien fuma o vapea fuera de casa'));
  if(st.ownRoom && (f.roomType==='compartida' || f.roomType==='litera')) blocks.push(t('Necesita habitación individual y la de la familia es compartida'));
  else if(st.ownRoom && f.roomType==='individual'){ score += 5; pros.push(t('Habitación individual')); }
  else if(st.ownRoom && !f.roomType) cons.push(t('Confirmar que la habitación es individual'));
  if(f.ownBath){ score += 3; pros.push(t('Baño propio')); }
  allergyNeeds(st.foodAllergies).forEach(a=>{ const ok = f.allergiesOk||[];
    if(a!=='otra' && ok.includes(a)) pros.push(t('Pueden atender la alergia: {a}',{a:optLabel(ALLERGIES(), a)}));
    else if(ok.includes('consultar')) cons.push(t('Confirmar con la familia la alergia: {a}',{a: a==='otra' ? st.foodAllergies : optLabel(ALLERGIES(), a)}));
    else { score -= 10; cons.push(t('No consta que puedan atender la alergia: {a}',{a: a==='otra' ? st.foodAllergies : optLabel(ALLERGIES(), a)})); } });
  const common = (st.interests||[]).filter(k=>(f.interests||[]).includes(k));
  if(common.length){ score += Math.min(15, common.length*5); pros.push(t('Intereses comunes: {l}',{l:common.map(k=>optLabel(INTERESTS(),k)).join(', ')})); }
  if(Number(f.hostYears)>=3){ score += 3; pros.push(t('{n} años con SEK',{n:f.hostYears})); }
  else if(f.firstTime && Number(st.age)<14) cons.push(t('Familia nueva y alumno menor de 14 años'));
  if(f.gender && f.gender!=='indiferente' && st.gender!==f.gender) blocks.push(f.gender==='chica' ? t('Solo acoge chicas') : t('Solo acoge chicos'));

  const pr = st.priorities || [], hasP = pr.length > 0;
  const W = k => { const i = pr.indexOf(k); return i<0 ? (hasP ? 0.6 : 1) : ([2,1.6,1.3,1,0.8,0.6][i] ?? 0.6); };
  const top = k => { const i = pr.indexOf(k); return i>=0 && i<3; };
  const tagP = k => { const i = pr.indexOf(k); return i>=0 && i<3 ? ' · '+t('prioridad {n}',{n:i+1}) : ''; };
  const add = (k, v, txt) => { score += v*W(k); if(v>=0) pros.push(txt+tagP(k)); else cons.push(txt+tagP(k)); };
  if(st.language && list(f.languages).some(l => norm(l)===norm(st.language))) add('idioma', 20, t('Hablan {l}',{l:st.language}));
  const ages = kidAges(f), age = Number(st.age);
  if(st.kidsPref==='si' || (hasP && top('ninos') && st.kidsPref!=='no')){
    if(ages.some(a => Math.abs(a-age)<=2)) add('ninos', 15, t('Hijos de edad similar'));
    else if(ages.length) add('ninos', 5, t('Hay niños en casa'));
    else add('ninos', -10, t('No hay niños en casa'));
  } else if(st.kidsPref==='no' && ages.length) add('tranquila', -15, t('Hay niños en casa'));
  if(hasP && top('tranquila') && st.kidsPref!=='no'){
    if(ages.some(a=>a<10)) add('tranquila', -8, t('Hay niños pequeños'));
    else add('tranquila', 8, t('Casa tranquila'));
  }
  if(hasP && top('mascotas') && !st.petAllergy){ if(f.pets) add('mascotas', 10, t('Tienen mascotas')); else add('mascotas', -5, t('No tienen mascotas')); }
  const d = Number(f.distance);
  if(f.distance!=='' && f.distance!=null && !isNaN(d)){
    if(d<=2) add('cercania', 10, t('A {d} km del colegio',{d}));
    else if(d>6) add('cercania', -10, t('A {d} km del colegio',{d}));
  }
  const rt = famRating(f.id);
  if(rt.n){
    if(rt.avg>=3.5) add('valoracion', rt.avg>=4.5 ? 10 : 5, t('Valoración {v} ★ ({n})',{v:fmt1(rt.avg), n:rt.n}));
    else if(rt.avg<3) add('valoracion', -10, t('Valoración baja: {v} ★',{v:fmt1(rt.avg)}));
  }
  return {ok:!blocks.length, score:Math.max(0,Math.min(100,Math.round(score))), blocks, pros, cons, pendingDates:cov==='pending'};
}
function conflicts(){
  const out = [];
  state.students.filter(s=>s.familyId && s.departure>=todayKey()).forEach(s => {
    if(s.familyId===RES_ID){ const b = residenceFit([s]); if(b.length) out.push({st:s, f:famById(RES_ID), level:'error', text:b.join(' · ')}); splitWarnings(s).forEach(w=>out.push({st:s, f:famById(RES_ID), level:'warn', text:w})); return; }
    const f = famById(s.familyId);
    if(!f){ out.push({st:s, level:'error', text:t('La familia asignada ya no existe')}); return; }
    const ev = evaluate(s,f);
    if(!ev.ok) out.push({st:s, f, level:'error', text:ev.blocks.join(' · ')});
    else if(ev.pendingDates) out.push({st:s, f, level:'warn', text:t('La familia aún no ha confirmado todas las fechas')});
    splitWarnings(s).forEach(w=>out.push({st:s, f, level:'warn', text:w}));
  });
  return out;
}

      `<button class="btn primary" data-act="nav" data-id="admin">${t('Definir periodos')}</button><button class="btn" data-act="newFamily">${t('Añadir familia')}</button><button class="btn" data-act="loadDemo">${t('Cargar datos de ejemplo')}</button>`)}`;
  }
  if(!(state.periods||[]).length) return `<div class="head"><div><h1>${t('Periodo en el colegio')}</h1></div></div>
    ${emptyBox(t('No hay periodos definidos'), t('Define en Administración los periodos en los que vienen los alumnos. El panel, la disponibilidad y las asignaciones se organizan por periodos.'), `<button class="btn primary" data-act="nav" data-id="admin">${t('Ir a Administración')}</button>`)}`;
  if(!periodById(ui.periodId)) ui.periodId = currentPeriodId();
  const p = periodById(ui.periodId);
  const studs = studentsIn(p);
  const unassigned = studs.filter(s=>!s.familyId);
  const fits = state.families.filter(f=>famStatus(f,p)==='yes');
  const free = fits.reduce((n,f)=>n+Math.max(0,(Number(f.capacity)||1)-occupants(f,p).length),0);
  const order = {yes:0,pending:1,partial:2,no:3};
  const fams = [...state.families].sort((a,b)=>order[famStatus(a,p)]-order[famStatus(b,p)] || a.name.localeCompare(b.name));
  const conf = conflicts();
  const otherUnassigned = state.students.filter(s=>!s.familyId && s.departure>=todayKey() && !studs.includes(s)).length;
  const pn = pendingNotices(), pr = pendingReviews().length;
  const noTutor = state.students.filter(s=>s.departure>=todayKey() && !s.tutorId).length;
  const stale = state.families.filter(profileStale).length;
  const autoNames = nameReviewList().length;
  const exp = Number(p.expected)||0;

  return `<div class="head"><div><h1>${t('Periodo en el colegio')}</h1><p>${t('Quién llega, dónde se aloja y qué queda por resolver.')}</p></div>${periodBar()}</div>
  <div class="summary">
    <div><b>${studs.length}${exp?`<small style="font-size:16px;color:var(--muted)"> / ${exp}</small>`:''}</b><span>${exp?t('estudiantes / previstos'):t('estudiantes en el periodo')}</span></div>
    <div class="${unassigned.length?'alert':''}"><b>${unassigned.length}</b><span>${t('sin familia asignada')}</span></div>
    <div><b>${fits.length}</b><span>${t('familias que encajan')}</span></div>
    <div class="${exp && free < exp-studs.filter(s=>s.familyId).length ? 'alert':''}"><b>${free}</b><span>${t('plazas libres')}</span></div>
  </div>
  ${p.notes?`<p class="muted" style="margin:10px 0 0">${esc(p.notes)}</p>`:''}
  ${resActive()?(()=>{ const u = residenceUse(periodSpan(p)), r = residence(); return `<div class="alerts" style="margin-top:10px"><div class="alert-item info"><p><b>${esc(r.name||t('Residencia'))}</b> · ${t('mujeres/chicas')} ${u.chica}/${resPlaces(r,'chica')} · ${t('hombres/chicos')} ${u.chico}/${resPlaces(r,'chico')}</p><button class="btn small" data-act="goResidence" data-id="${p.id}">${t('Ir a la residencia')}</button></div></div>`; })():''}
  ${(unassigned.length || conf.length) ? `<h2 class="section-title">${t('Por resolver')}</h2><div class="alerts">
    ${unassigned.map(s=>`<div class="alert-item"><p>${t('<b>{n}</b> no tiene familia',{n:esc(s.name)})}<small>${fmt(s.arrival)} – ${fmt(s.departure)} · ${esc(s.country||'')}</small></p><button class="btn small primary" data-act="pick" data-id="${s.id}">${t('Buscar familia')}</button></div>`).join('')}
    ${conf.map(c=>`<div class="alert-item ${c.level==='warn'?'warn':''}"><p><b>${esc(c.st.name)}</b> · ${c.f?famName(c.f):'—'}<small>${esc(c.text)}</small></p><button class="btn small" data-act="pick" data-id="${c.st.id}">${t('Revisar')}</button></div>`).join('')}
  </div>`:''}
  ${(()=>{ const ms = monitorsIn(p), mc = monitorConflicts().filter(x=>ms.includes(x.mon)), sin = ms.filter(m=>!m.familyId), aviso = ms.filter(m=>m.familyId && m.familyId!==RES_ID && !m.notified);
    if(!sin.length && !mc.length && !aviso.length) return '';
    return `<h2 class="section-title">${t('Monitores del periodo')}</h2><div class="alerts">
      ${sin.map(m=>`<div class="alert-item"><p>${t('El monitor <b>{n}</b> no tiene familia',{n:esc(m.name)})}<small>${esc(m.school||'')} · ${pl(groupStudents(m).length, t('{n} alumno de su colegio'), t('{n} alumnos de su colegio'))}</small></p><button class="btn small primary" data-act="monAssign" data-id="${m.id}">${t('Buscar familia')}</button></div>`).join('')}
      ${mc.map(x=>`<div class="alert-item ${x.level==='warn'?'warn':''}"><p><b>${esc(x.mon.name)}</b> · ${x.f?famName(x.f):'—'}<small>${esc(x.text)}</small></p><button class="btn small" data-act="monAssign" data-id="${x.mon.id}">${t('Revisar')}</button></div>`).join('')}
      ${aviso.map(m=>`<div class="alert-item warn"><p>${t('La familia <b>{f}</b> aún no sabe que aloja al monitor <b>{s}</b>',{f:esc(famById(m.familyId)?.name||''), s:esc(m.name)})}</p><button class="btn small primary" data-act="mEmail" data-id="${m.id}">${t('Enviar correo')}</button></div>`).join('')}
    </div>`; })()}
  ${pn.length ? `<h2 class="section-title">${t('Familias por avisar')}</h2><div class="alerts">${pn.slice(0,6).map(s=>{ const f = famById(s.familyId);
      return `<div class="alert-item warn"><p>${t('La familia <b>{f}</b> aún no sabe que acoge a <b>{s}</b>',{f:esc(f.name), s:esc(s.name)})}<small>${fmt(s.arrival)} – ${fmt(s.departure)} · ${f.email?esc(f.email):t('sin correo registrado')}</small></p><button class="btn small primary" data-act="email" data-id="${s.id}">${t('Enviar correo')}</button></div>`; }).join('')}
      ${pn.length>6?`<p class="muted" style="margin:4px 0 0">${t('Y {n} más.',{n:pn.length-6})}</p>`:''}</div>` : ''}
  ${(state.inbox||[]).length ? `<div class="alerts" style="margin-top:8px"><div class="alert-item info"><p>${pl(state.inbox.length, t('{n} respuesta de formulario pendiente de revisar'), t('{n} respuestas de formulario pendientes de revisar'))}</p><button class="btn small primary" data-act="nav" data-id="solicitudes">${t('Ver solicitudes')}</button></div></div>` : ''}
  ${(pr || noTutor || otherUnassigned || stale || autoNames) ? `<div class="alerts" style="margin-top:8px">
    ${autoNames?`<div class="alert-item warn"><p>${pl(autoNames, t('{n} nombre separado automáticamente en nombre y apellidos'), t('{n} nombres separados automáticamente en nombre y apellidos'))}<small>${t('Revisa que el nombre y los apellidos estén bien separados.')}</small></p><button class="btn small primary" data-act="nameReview">${t('Revisar')}</button></div>`:''}
    ${stale?`<div class="alert-item info"><p>${pl(stale, t('{n} perfil de familia sin revisar en el último año'), t('{n} perfiles de familia sin revisar en el último año'))}</p><button class="btn small" data-act="nav" data-id="familias">${t('Ver familias')}</button></div>`:''}
    ${pr?`<div class="alert-item warn"><p>${pl(pr, t('{n} estancia finalizada sin valorar por el tutor'), t('{n} estancias finalizadas sin valorar por el tutor'))}</p><button class="btn small" data-act="nav" data-id="tutores">${t('Ver tutores')}</button></div>`:''}
    ${noTutor?`<div class="alert-item info"><p>${pl(noTutor, t('{n} alumno sin tutor de seguimiento'), t('{n} alumnos sin tutor de seguimiento'))}</p><button class="btn small" data-act="nav" data-id="asignar">${t('Asignar tutor')}</button></div>`:''}
    ${otherUnassigned?`<div class="alert-item info"><p>${pl(otherUnassigned, t('{n} estudiante de otros periodos sin familia'), t('{n} estudiantes de otros periodos sin familia'))}</p><button class="btn small" data-act="nav" data-id="asignar">${t('Ver')}</button></div>`:''}
  </div>` : ''}
  <h2 class="section-title">${t('Casas en este periodo')}</h2>
  <div class="legend" style="margin-bottom:14px"><span><i style="background:var(--ok)"></i>${t('Encaja')}</span><span><i style="background:var(--wait)"></i>${t('Pendiente de confirmar')}</span><span><i style="background:var(--none)"></i>${t('Encaja en parte')}</span><span><i style="background:var(--no)"></i>${t('Sin disponibilidad')}</span><span>${t('Cada ventana es una plaza; rellena = ocupada')}</span></div>
  ${state.families.length || resActive() ? `<div class="board">${residenceHouses(p)}${fams.map(f=>{
    const s = famStatus(f,p), occ = occupants(f,p), cap = Number(f.capacity)||1;
    return `<button class="house" data-s="${s}" data-act="famAvail" data-id="${f.id}" aria-label="${esc(f.name)}, ${covLabel(s)}, ${occ.length}/${cap}">
      <div class="roof"></div><div class="wall"><h3>${esc(f.name)}</h3><span class="state">${covLabel(s)}</span>
      <div class="windows">${Array.from({length:Math.max(cap,occ.length)},(_,i)=>`<span class="win ${i<occ.length?'on':''}"></span>`).join('')}</div>
      <div class="guests">${occ.length ? occ.map(o=>`<b>${esc(o.name)}</b>${o.role==='monitor'?` (${t('monitor')})`:''}`).join(', ') : (s==='yes'?t('Libre'):'—')}</div></div></button>`;}).join('')}</div>`
  : emptyBox(t('No hay familias en el catálogo'), '', `<button class="btn primary" data-act="newFamily">${t('Añadir familia')}</button>`)}`;
}

/* ================= Cuadro de mando ================= */
function dashPeriods(){
  const ps = periodsSorted(), d = todayKey();
  if(ui.period==='todo') return ps;
  const up = ps.filter(p=>p.end>=d);
  return (up.length ? up : ps).slice(0, ui.period);
}
function viewDash(){
  const periodSeg = `<div class="seg" role="group" aria-label="${t('Periodo')}">${[['4',t('Próximos 4')],['8',t('Próximos 8')],['todo',t('Todos')]].map(([k,l])=>`<button data-act="period" data-id="${k}" aria-pressed="${String(ui.period)===k}">${l}</button>`).join('')}</div>`;
  if(!state.families.length && !state.students.length)
    return `<div class="head"><div><h1>${t('Cuadro de mando')}</h1></div></div>${emptyBox(t('No hay datos que analizar'), t('Añade familias y estudiantes, o carga el ejemplo para ver el cuadro de mando completo.'), `<button class="btn" data-act="loadDemo">${t('Cargar datos de ejemplo')}</button>`)}`;
  const periods = dashPeriods();
  if(!periods.length) return `<div class="head"><div><h1>${t('Cuadro de mando')}</h1></div></div>${emptyBox(t('No hay periodos definidos'), t('Define en Administración los periodos en los que vienen los alumnos. El panel, la disponibilidad y las asignaciones se organizan por periodos.'), `<button class="btn primary" data-act="nav" data-id="admin">${t('Ir a Administración')}</button>`)}`;
  const studs = state.students.filter(s=>periods.some(p=>overlaps(s, periodSpan(p))));
  const assigned = studs.filter(s=>s.familyId).length;
  const pct = studs.length ? Math.round(assigned/studs.length*100) : 0;
  const conf = conflicts().filter(c=>studs.includes(c.st));
  const per = periods.map(p=>{
    const st = studentsIn(p), a = st.filter(s=>s.familyId).length;
    const counts = {yes:0,pending:0,partial:0,no:0}; let places = 0, occ = 0;
    state.families.forEach(f=>{ const s = famStatus(f,p); counts[s]++; occ += occupants(f,p).length; if(s==='yes') places += Number(f.capacity)||1; });
    return {p, total:st.length, a, u:st.length-a, counts, places, occ, exp:Number(p.expected)||0};
  });
  const totPlaces = per.reduce((n,x)=>n+x.places,0), totOcc = per.reduce((n,x)=>n+x.occ,0);
  const occPct = totPlaces ? Math.min(100,Math.round(totOcc/totPlaces*100)) : 0;
  const activeFams = state.families.filter(f=>periods.some(p=>famStatus(f,p)==='yes')).length;
  const deficit = per.filter(x=>Math.max(x.total,x.exp)>x.places);
  const nF = Math.max(1,state.families.length), now = currentPeriodId();
  const col = x => `<span class="l ${x.p.id===now?'now':''}" title="${esc(x.p.name)}">${fmt(x.p.start)}</span>`;

  const max1 = Math.max(1,...per.map(x=>Math.max(x.total,x.exp)));
  const chart1 = `<div class="cols-wrap"><div class="cols">${per.map(x=>`<div class="col" title="${esc(periodLabel(x.p))}: ${x.a} / ${x.u}${x.exp?' · '+t('previstos')+' '+x.exp:''}">
    <span class="v ${x.u?'bad':''}">${x.total||''}</span>
    <div class="area"><div class="stack" style="height:${x.total/max1*100}%">${x.a?`<div style="flex:${x.a};background:var(--brand)"></div>`:''}${x.u?`<div style="flex:${x.u};background:var(--no)"></div>`:''}</div></div>${col(x)}</div>`).join('')}</div></div>`;
  const max2 = Math.max(1,...per.map(x=>Math.max(x.places,x.total,x.exp)));
  const chart2 = `<div class="cols-wrap"><div class="cols">${per.map(x=>{ const need = Math.max(x.total,x.exp), d = need-x.places;
    return `<div class="col" title="${esc(periodLabel(x.p))}: ${x.places} / ${need}">
    <span class="v ${d>0?'bad':''}">${d>0?'−'+d:''}</span>
    <div class="area"><div class="bar" style="height:${x.places/max2*100}%;background:var(--ok)"></div><div class="bar" style="height:${need/max2*100}%;background:var(--brand)"></div></div>${col(x)}</div>`;}).join('')}</div></div>`;
  const chart3 = `<div class="hbars">${per.map(x=>`<div class="hrow"><span title="${esc(periodLabel(x.p))}">${esc(x.p.name)}</span><div class="track" role="img" aria-label="${x.counts.yes} / ${x.counts.pending} / ${x.counts.partial} / ${x.counts.no}">
    ${['yes','pending','partial','no'].map(k=>x.counts[k]?`<div style="width:${x.counts[k]/nF*100}%;background:var(--${k==='yes'?'ok':k==='pending'?'wait':k==='no'?'no':'none'})"></div>`:'').join('')}</div><b>${x.counts.yes}</b></div>`).join('')}</div>`;

  const needs = [];
  DIETS.forEach(d=>{ const n = studs.filter(s=>s.diet===d).length; if(n) needs.push([t('Dieta {d}',{d:dietLabel(d)}),n]); });
  [[t('Alergia a animales'),s=>s.petAllergy],[t('Alergias alimentarias'),s=>s.foodAllergies],[t('Casa sin humo'),s=>s.smokeFree],[t('Quiere niños en casa'),s=>s.kidsPref==='si'],[t('Prefiere sin niños'),s=>s.kidsPref==='no']]
    .forEach(([l,fn])=>{ const n = studs.filter(fn).length; if(n) needs.push([l,n]); });
  needs.sort((a,b)=>b[1]-a[1]);
  const tally = (key, lab=(k=>k)) => { const m = {}; studs.forEach(s=>{ const k = String(s[key]||'').trim() || '__none'; m[k] = (m[k]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k==='__none'?t('Sin indicar'):lab(k), v]); };
  const famRows = state.families.map(f=>{
    const cap = Number(f.capacity)||1;
    const yesP = periods.filter(p=>famStatus(f,p)==='yes').length;
    const pendP = periods.filter(p=>famStatus(f,p)==='pending').length;
    const hosted = studs.filter(s=>s.familyId===f.id).length;
    const used = periods.filter(p=>famStatus(f,p)==='yes').reduce((n,p)=>n+occupants(f,p).length,0);
    return {f,cap,yesP,pendP,hosted,u:yesP ? Math.min(100,Math.round(used/(cap*yesP)*100)) : 0};
  }).sort((a,b)=>b.hosted-a.hosted || b.yesP-a.yesP);
  const arrivals = [...studs].sort((a,b)=>a.arrival.localeCompare(b.arrival));
  const rated = state.families.map(f=>({f, r:famRating(f.id)})).filter(x=>x.r.n).sort((a,b)=>b.r.avg-a.r.avg);
  const allRev = state.students.filter(s=>s.review);
  const perAsp = ASPECTS().map(([k,l])=>{ const v = allRev.map(s=>s.review.scores[k]).filter(Boolean); return [l, v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0]; });
  const tut = (state.tutors||[]).map(x=>({x, act:studs.filter(s=>s.tutorId===x.id).length, done:state.students.filter(s=>s.review && s.review.tutorId===x.id).length, pend:pendingReviews().filter(s=>s.tutorId===x.id).length}));
  const first = periods[0], last = periods[periods.length-1];

  return `<div class="head"><div><h1>${t('Cuadro de mando')}</h1><p>${t('Del {a} al {b}',{a:fmt(first.start), b:fmtY(last.end)})} · ${pl(periods.length, t('{n} periodo'), t('{n} periodos'))}</p></div>${periodSeg}</div>
  <div class="summary">
    <div><b>${studs.length}</b><span>${t('estudiantes en los periodos')}</span></div>
    <div class="${studs.length-assigned?'alert':''}"><b>${studs.length-assigned}</b><span>${t('sin familia')}</span></div>
    <div><b>${activeFams}<small style="font-size:16px;color:var(--muted)"> / ${state.families.length}</small></b><span>${t('familias que encajan en algún periodo')}</span></div>
    <div><b>${occPct}%</b><span>${t('ocupación de plazas')}</span></div>
    <div class="${conf.length?'alert':''}"><b>${conf.length}</b><span>${t('conflictos y avisos')}</span></div>
  </div>
  <div class="dash-grid">
    <div class="card"><h3>${t('Estado de las asignaciones')}</h3><p class="desc">${t('Estudiantes de estos periodos que ya tienen familia.')}</p>
      <div class="ring-row"><div class="ring" style="--v:${pct}" role="img" aria-label="${pct}%"><span>${pct}%</span></div>
      <ul><li><span class="tag green">${assigned}</span> ${t('con familia')}</li><li><span class="tag red">${studs.length-assigned}</span> ${t('sin familia')}</li>
      <li><span class="tag amber">${conf.filter(c=>c.level==='warn').length}</span> ${t('con fechas sin confirmar')}</li><li><span class="tag red">${conf.filter(c=>c.level==='error').length}</span> ${t('asignaciones con conflicto')}</li></ul></div>
      ${studs.length-assigned?`<div class="row" style="margin-top:14px"><button class="btn small primary" data-act="nav" data-id="asignar">${t('Asignar pendientes')}</button></div>`:''}</div>
    <div class="card"><h3>${t('Plazas frente a demanda')}</h3><p class="desc">${deficit.length?pl(deficit.length, t('Faltan plazas confirmadas en {n} periodo.'), t('Faltan plazas confirmadas en {n} periodos.')):t('Hay plazas confirmadas suficientes en todos los periodos.')}</p>
      <div class="key"><span><i style="background:var(--ok)"></i>${t('Plazas en familias que encajan')}</span><span><i style="background:var(--brand)"></i>${t('Estudiantes (o previstos)')}</span><span style="color:var(--no)">${t('−n = plazas que faltan')}</span></div>${chart2}</div>
    <div class="card wide"><h3>${t('Estudiantes por periodo')}</h3><p class="desc">${t('Cuántos estudiantes hay en cada periodo y cuántos siguen sin familia.')}</p>
      <div class="key"><span><i style="background:var(--brand)"></i>${t('Con familia')}</span><span><i style="background:var(--no)"></i>${t('Sin familia')}</span></div>${chart1}</div>
    <div class="card wide"><h3>${t('Disponibilidad de las familias')}</h3><p class="desc">${t('Cuántas familias encajan en cada periodo. El número indica las que encajan con fechas confirmadas.')}</p>
      <div class="key"><span><i style="background:var(--ok)"></i>${t('Encaja')}</span><span><i style="background:var(--wait)"></i>${t('Pendiente de confirmar')}</span><span><i style="background:var(--none)"></i>${t('Encaja en parte')}</span><span><i style="background:var(--no)"></i>${t('Sin disponibilidad')}</span></div>${chart3}</div>
    <div class="card"><h3>${t('Valoración de las familias')}</h3><p class="desc">${t('Media de todas las valoraciones de los tutores (histórico completo).')}</p>${rated.length?hbars(rated.slice(0,8).map(x=>[x.f.name+' ('+x.r.n+')',x.r.avg]),'var(--star)',{max:5,fmt:fmt1}):`<p class="muted">${t('Aún no hay valoraciones.')}</p>`}</div>
    <div class="card"><h3>${t('Puntuación por aspecto')}</h3><p class="desc">${t('Media global de cada aspecto valorado.')}</p>${allRev.length?hbars(perAsp,'var(--star)',{max:5,fmt:fmt1}):`<p class="muted">${t('Aún no hay valoraciones.')}</p>`}</div>
    <div class="card wide"><h3>${t('Seguimiento de los tutores')}</h3><p class="desc">${t('Alumnos de estos periodos por tutor y valoraciones de estancias ya finalizadas.')}</p>
      ${tut.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('Tutor')}</th><th>${t('Alumnos en el periodo')}</th><th>${t('Valoraciones hechas')}</th><th>${t('Pendientes de valorar')}</th></tr></thead><tbody>${tut.map(x=>`<tr><td><button class="link" data-act="openTutor" data-id="${x.x.id}">${esc(x.x.name)}</button></td><td>${x.act}</td><td>${x.done}</td><td>${x.pend?`<span class="tag amber">${x.pend}</span>`:`<span class="tag green">${t('Al día')}</span>`}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${t('No hay tutores registrados.')}</p>`}
      ${studs.filter(s=>!s.tutorId).length?`<p style="margin:10px 0 0"><span class="tag red">${pl(studs.filter(s=>!s.tutorId).length, t('{n} alumno del periodo sin tutor'), t('{n} alumnos del periodo sin tutor'))}</span></p>`:''}</div>
    <div class="card"><h3>${t('SEK y No SEK')}</h3><p class="desc">${t('Estudiantes del periodo según su red de colegios.')}</p>${hbars(tally('sek', sekLabel),'var(--brand)')}

    <div class="card"><h3>${t('Necesidades de los estudiantes')}</h3><p class="desc">${t('Requisitos que condicionan la elección de familia.')}</p>${hbars(needs,'var(--wait)')}</div>
    <div class="card"><h3>${t('Procedencia')}</h3><p class="desc">${t('Países de origen de los estudiantes del periodo.')}</p>${hbars(tally('country'),'var(--brand)')}
      <h3 style="margin-top:18px">${t('Idiomas')}</h3><p class="desc">${t('Idioma principal de cada estudiante.')}</p>${hbars(tally('language'),'var(--ok)')}</div>
    <div class="card"><h3>${t('Monitores')}</h3><p class="desc">${t('Monitores de estos periodos y dónde se alojan.')}</p>${(()=>{ const ms = (state.monitors||[]).filter(m=>periods.some(p=>overlaps(m, periodSpan(p)))); const mc = monitorConflicts().filter(x=>ms.includes(x.mon) && x.level==='error').length;

    <div class="card"><h3>${t('Familias por zona')}</h3><p class="desc">${t('Dónde viven las familias del catálogo.')}</p>${(()=>{ const z = {}; state.families.forEach(f=>{ const k = f.zone || t('Sin indicar'); z[k] = (z[k]||0)+1; }); return hbars(Object.entries(z).sort((a,b)=>b[1]-a[1]),'var(--brand)'); })()}</div>
    <div class="card"><h3>${t('Habitaciones y perfiles')}</h3><p class="desc">${t('Tipo de habitación para el estudiante y perfiles por revisar.')}</p>${hbars([[t('Individual'),state.families.filter(f=>f.roomType==='individual').length],[t('Compartida (varias camas)'),state.families.filter(f=>f.roomType==='compartida').length],[t('Litera'),state.families.filter(f=>f.roomType==='litera').length],[t('Sin indicar'),state.families.filter(f=>!f.roomType).length],[t('Baño propio'),state.families.filter(f=>f.ownBath).length],[t('Perfil sin revisar o de hace más de un año'),state.families.filter(profileStale).length]].filter(x=>x[1]),'var(--ok)')}</div>
    <div class="card wide"><h3>${t('Familias')}</h3><p class="desc">${t('En cuántos periodos encaja cada familia, estudiantes acogidos y aprovechamiento de sus plazas.')}</p>
      ${state.families.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('Familia')}</th><th>${t('Plazas')}</th><th>${t('Periodos en los que encaja')}</th><th>${t('Por confirmar')}</th><th>${t('Estudiantes')}</th><th>${t('Ocupación')}</th></tr></thead><tbody>
      ${famRows.map(r=>`<tr><td><button class="link" data-act="famAvail" data-id="${r.f.id}">${esc(r.f.name)}</button></td><td>${r.cap}</td><td>${t('{a} de {b}',{a:r.yesP,b:periods.length})}</td>
        <td>${r.pendP?`<span class="tag amber">${pl(r.pendP, t('{n} periodo'), t('{n} periodos'))}</span>`:`<span class="tag green">${t('Al día')}</span>`}</td><td>${r.hosted}</td>
        <td><span class="mini"><div style="width:${r.u}%"></div></span>${r.yesP?r.u+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${t('No hay familias en el catálogo')}</p>`}</div>
    <div class="card wide"><h3>${t('Estancias de estos periodos')}</h3><p class="desc">${t('Todos los estudiantes con su periodo y alojamiento.')}</p>
      ${arrivals.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('Estudiante')}</th><th>${t('Periodo')}</th><th>${t('Colegio de origen')}</th><th>${t('País')}</th><th>${t('Necesidades')}</th><th>${t('Familia')}</th></tr></thead><tbody>
      ${arrivals.map(s=>{ const f = famById(s.familyId), c = conf.find(x=>x.st===s), pp = periodById(s.periodId);

        <td>${pp?esc(pp.name):'—'}${s.extendPeriodId?` <span class="tag blue">${t('Ampliada')}</span>`:''}<div class="muted" style="font-size:12.5px;white-space:nowrap">${fmt(s.arrival)} – ${fmt(s.departure)}</div></td><td>${sekTag(s)} ${esc(s.school||'')}<div class="muted" style="font-size:12.5px">${esc(s.course||'')}</div></td><td>${esc(s.country||'')}</td><td><div class="tags">${needTags(s)}</div></td>
        <td>${f?`${esc(f.name)}${c?` <span class="tag ${c.level==='warn'?'amber':'red'}">${c.level==='warn'?t('Sin confirmar'):t('Conflicto')}</span>`:''}`:`<span class="tag red">${t('Sin familia')}</span>`}</td></tr>`;}).join('')}</tbody></table></div>`
