/* ================= Asignar ================= */
function viewAssign(){
  if(ui.assignDest==='residencia') return viewAssignResidence();
  if(ui.assignMode==='subgrupo') return viewAssignGroups();
  if(!state.students.length) return `<div class="head"><div><h1>${t('Asignar familias')}</h1></div></div>${emptyBox(t('No hay estudiantes registrados'), t('Añade un estudiante con sus fechas y necesidades para ver qué familias encajan.'), `<button class="btn primary" data-act="newStudent">${t('Añadir estudiante')}</button>`)}`;
  const sorted = [...state.students].sort((a,b)=>(!!a.familyId - !!b.familyId) || a.arrival.localeCompare(b.arrival));
  if(!ui.selected || !stuById(ui.selected)) ui.selected = (sorted.find(s=>!s.familyId)||sorted[0]).id;
  const st = stuById(ui.selected);
  const evals = state.families.map(f=>({f, ev:evaluate(st,f)}));
  const ok = evals.filter(x=>x.ev.ok).sort((a,b)=>b.ev.score-a.ev.score);
  const bad = evals.filter(x=>!x.ev.ok);
  const cur = st.familyId && famById(st.familyId);
  const scColor = v => v>=70?'var(--ok)':v>=45?'var(--wait)':'var(--no)';
  const nStays = staysOf(personKey(st)).length;

  return `<div class="head"><div><h1>${t('Asignar familias')}</h1><p>${t('Las familias que no cumplen un requisito obligatorio quedan descartadas; el resto se ordena por afinidad.')}</p></div><div class="row">${assignModeSeg()}<button class="btn" data-act="newStudent">${t('Añadir estudiante')}</button></div></div>
  <div class="assign">
    <div class="stu-list" role="list">${sorted.map(s=>`<button class="stu-btn" role="listitem" data-act="pick" data-id="${s.id}" ${s.id===st.id?'aria-current="true"':''}>
      <span class="dot ${s.familyId?'ok':''}"></span><span><b>${esc(s.name)}</b><small>${periodById(s.periodId)?esc(periodById(s.periodId).name)+' · ':''}${fmt(s.arrival)} – ${fmt(s.departure)}${(()=>{ const m = companions(s).filter(c=>c.id!==s.id); return m.length ? ' · '+t('con {n}',{n:m.map(c=>esc(c.name.split(' ')[0])).join(', ')}) : ''; })()}</small></span></button>`).join('')}</div>
    <div>
      <div class="panel stu-card">
        <div class="row" style="justify-content:space-between"><h2>${esc(st.name)}</h2><div class="row"><button class="btn small" data-act="stuHistory" data-id="${st.id}">${t('Histórico')}${nStays>1?` (${pl(nStays, t('{n} estancia'), t('{n} estancias'))})`:''}</button><button class="btn small" data-act="editStudent" data-id="${st.id}">${t('Editar ficha')}</button></div></div>
        <p class="muted" style="margin:4px 0 10px">${t('{n} años',{n:esc(st.age)})} · ${genderLabel(st.gender)} · ${esc(st.country||'')} · ${t('del {a} al {b}',{a:fmt(st.arrival), b:fmt(st.departure)})}</p>
        ${(()=>{ const p = periodById(st.periodId); if(!p) return `<p style="margin:-6px 0 10px"><span class="tag red">${t('Sin periodo asignado')}</span></p>`;
          const n = nextContiguous(p), q = st.extendPeriodId && periodById(st.extendPeriodId);
          return `<div class="row" style="margin:-4px 0 10px;gap:10px"><span class="tag blue">${t('Periodo')}: ${esc(p.name)}</span>${q?`<span class="tag blue">${t('Ampliada hasta {n}',{n:esc(q.name)})}</span><button class="btn small" data-act="unextend" data-id="${st.id}">${t('Quitar ampliación')}</button>`:n?`<button class="btn small" data-act="extend" data-id="${st.id}">${t('Ampliar al siguiente periodo ({n})',{n:esc(n.name)})}</button>`:''}</div>`; })()}
        ${schoolLine(st)?`<p style="margin:-6px 0 10px">${schoolLine(st)}</p>`:''}
        <div class="tags">${visitTag(st)}${sekTag(st)}${needTags(st) || `<span class="muted">${t('Sin necesidades especiales')}</span>`}</div>
        ${st.notes?`<p class="muted" style="margin:10px 0 0">${esc(st.notes)}</p>`:''}
        ${(()=>{ const mates = companions(st).filter(c=>c.id!==st.id); return mates.length ? `<p style="margin:10px 0 0;font-size:14px">${t('Comparte alojamiento con')}: ${mates.map(c=>`<b>${esc(c.name)}</b>${c.familyId?` <span class="muted">(${esc(famById(c.familyId)?.name||'')})</span>`:''}`).join(', ')} <button class="link" data-act="assignModeSub" data-id="${st.id}" style="color:var(--brand)">${t('Ver como subgrupo')}</button></p>`
          : `<p class="muted" style="margin:10px 0 0;font-size:13.5px">${t('No comparte alojamiento con nadie. Puedes indicarlo en «Editar ficha» → «Comparte alojamiento con».')}</p>`; })()}
        ${st.groupId&&groupById(st.groupId)?`<p style="margin:6px 0 0;font-size:14px">${t('Grupo')}: <b>${esc(groupLabel(groupById(st.groupId)))}</b></p>`:''}
        ${(st.priorities||[]).length?`<p style="margin:10px 0 0;font-size:14px">${t('Prioridades')}: ${st.priorities.map((k,i)=>`<b>${i+1}.</b> ${esc(prioLabel(k))}`).join(' · ')}</p>`:''}
        ${st.extendRequested && !st.extendPeriodId?`<p style="margin:8px 0 0"><span class="tag blue">${t('Ha pedido ampliar al siguiente periodo si es posible')}</span></p>`:''}
        <div class="tutor-box"><label>${t('Tutor de seguimiento')} <select data-change="tutor" data-id="${st.id}"><option value="">${t('Sin asignar')}</option>${(state.tutors||[]).map(x=>`<option value="${x.id}" ${st.tutorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
          ${cur ? `<span class="row">${st.review?starsHTML(reviewAvg(st.review)):''}<button class="btn small ${st.review?'':'primary'}" data-act="review" data-id="${st.id}">${st.review?t('Ver valoración'):t('Valorar familia')}</button></span>` : `<span class="muted" style="font-size:13.5px">${t('Asigna una familia para poder valorarla')}</span>`}</div>
        ${residenceBox(st)}
        ${cur ? `${cur.isResidence?'':`<div class="tutor-box" style="background:${st.notified?'var(--ok-bg)':'var(--wait-bg)'}"><span>${st.notified?t('Familia avisada por correo el {d}',{d:fmtY(st.notified.date)}):(cur.email?t('La familia todavía no ha recibido el aviso'):t('La familia todavía no ha recibido el aviso (no tiene correo registrado)'))}</span>
          <button class="btn small ${st.notified?'':'primary'}" data-act="email" data-id="${st.id}">${st.notified?t('Volver a enviar'):t('Enviar correo a la familia')}</button></div>`}
        <div class="current"><span>${cur.isResidence?t('Alojado en {n}',{n:`<b>${esc(cur.name)}</b>`}):t('Alojado con la familia {n}',{n:`<b>${esc(cur.name)}</b>`})}${cur.phone?' · '+esc(cur.phone):''}</span><button class="btn small" data-act="unassign" data-id="${st.id}">${t('Quitar asignación')}</button></div>`:''}
      </div>
      <h2 class="section-title">${pl(ok.length, t('{n} familia compatible'), t('{n} familias compatibles'))}</h2>
      ${ok.length ? `<div class="cands">${ok.map(({f,ev})=>`<div class="cand">
        <div class="score" style="--v:${ev.score};--sc:${scColor(ev.score)}" aria-label="${t('Afinidad {v} de 100',{v:ev.score})}"><span>${ev.score}</span></div>
        <div><h3>${famName(f)}</h3><span class="muted" style="font-size:13.5px">${esc(f.address||'')}</span>
          <ul class="reasons">${ev.pros.map(p=>`<li class="p">✓ ${esc(p)}</li>`).join('')}${ev.cons.map(c=>`<li class="c">! ${esc(c)}</li>`).join('')}</ul></div>
        <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">${(()=>{ const mem = companions(st); if(mem.length<2 || mem.every(m=>m.familyId===f.id)) return ''; const b = groupFit(mem, f);
          return b.length ? `<span class="muted" style="font-size:12.5px;max-width:220px" title="${esc(b.join(' · '))}">${t('No caben los {n} juntos',{n:mem.length})}</span>` : `<button class="btn primary" data-act="assignGroup" data-id="${f.id}">${t('Asignar a los {n} juntos',{n:mem.length})}</button>`; })()}
        ${st.familyId===f.id ? `<button class="btn small" disabled>${t('Asignada')}</button>` : `<button class="btn ${companions(st).length>1?'':'primary'}" data-act="assign" data-id="${f.id}">${companions(st).length>1?t('Solo este alumno'):(st.familyId?t('Cambiar a esta'):t('Asignar'))}</button>`}</div>
      </div>`).join('')}</div>`
      : emptyBox(t('Ninguna familia cumple los requisitos'), t('Revisa las familias descartadas: quizá alguna pueda cambiar su disponibilidad o adaptar la dieta.'))}
      ${bad.length ? `<details class="excluded"><summary>${pl(bad.length, t('{n} descartada'), t('{n} descartadas'))}</summary><div class="panel">${bad.map(({f,ev})=>`<div class="ex-item"><b>${esc(f.name)}</b> <span class="muted">— ${esc(ev.blocks.join(' · '))}</span></div>`).join('')}</div></details>`:''}
    </div>
  </div>`;
}

/* ================= Estudiantes ================= */
function studentRows(){
  const q = norm(ui.stuSearch);
  let arr = [...state.students].sort((a,b)=>a.arrival.localeCompare(b.arrival));
  if(ui.stuFilter==='sin') arr = arr.filter(s=>!s.familyId);
  if(ui.stuFilter==='con') arr = arr.filter(s=>s.familyId);
  if(ui.stuPeriod) arr = arr.filter(s=>s.periodId===ui.stuPeriod || s.extendPeriodId===ui.stuPeriod);
  if(ui.stuGroup) arr = arr.filter(s=>s.groupId===ui.stuGroup);
  if(q) arr = arr.filter(s=>norm([s.name,s.email,s.country,s.school,s.course,s.sek].join(' ')).includes(q));
  if(!arr.length){ const g = ui.stuGroup && groupById(ui.stuGroup);
    return g ? emptyBox(t('Ningún alumno está unido al grupo {c} con estos filtros',{c:esc(g.code)}), t('Si sus alumnos ya están en la app pero sin grupo, únelos desde Grupos → «Unir alumnos al grupo».'), `<button class="btn primary" data-act="groupLink" data-id="${g.id}">${t('Unir alumnos al grupo')}</button>`)
      : emptyBox(t('No hay estudiantes que mostrar'), t('Cambia el filtro o añade un estudiante nuevo.')); }
  return `<div class="list">${arr.map(s=>{ const f = famById(s.familyId);
    return `<div class="item"><div><button class="name" data-act="editStudent" data-id="${s.id}">${esc(s.name)}</button><div class="sub">${s.groupId&&groupById(s.groupId)?`<b>${esc(groupById(s.groupId).code)}</b> · `:''}${t('{n} años',{n:esc(s.age)})} · ${esc(s.country||'')} · ${periodById(s.periodId)?esc(periodById(s.periodId).name)+' · ':''}${fmt(s.arrival)} – ${fmt(s.departure)}</div>${schoolLine(s)?`<div class="sub">${schoolLine(s)}</div>`:''}</div>
    <div class="tags">${visitTag(s)}${sekTag(s)}${needTags(s)}</div>
    <div>${f ? `<button class="btn small" data-act="pick" data-id="${s.id}">${famName(f)}</button>` : `<button class="btn small primary" data-act="pick" data-id="${s.id}">${t('Buscar familia')}</button>`}</div></div>`;}).join('')}</div>`;
}

/* ================= Tutores ================= */
function viewTutors(){
  const tutors = [...(state.tutors||[])].sort((a,b)=>a.name.localeCompare(b.name));
  const head = `<div class="head"><div><h1>${t('Tutores')}</h1><p>${t('Cada tutor hace el seguimiento alumno-familia y valora a la familia al terminar la estancia.')}</p></div><button class="btn primary" data-act="newTutor">${t('Añadir tutor')}</button></div>`;
  if(!tutors.length) return head + emptyBox(t('Todavía no hay tutores'), t('Añade a los profesores que harán el seguimiento de los alumnos en sus familias.'), `<button class="btn primary" data-act="newTutor">${t('Añadir tutor')}</button>`);
  if(!tutorById(ui.tutorSel)) ui.tutorSel = tutors[0].id;
  const tu = tutorById(ui.tutorSel), d = todayKey();
  const mine = state.students.filter(s=>s.tutorId===tu.id).sort((a,b)=>b.arrival.localeCompare(a.arrival));
  const pend = mine.filter(s=>s.familyId && !s.review && s.departure<d);
  const active = mine.filter(s=>s.departure>=d);
  const noTutor = state.students.filter(s=>!s.tutorId && s.departure>=d).length;
  const row = s => { const f = famById(s.familyId);
    return `<tr><td><button class="link" data-act="pick" data-id="${s.id}">${esc(s.name)}</button> ${visitTag(s)}<div class="muted" style="font-size:12.5px">${schoolLine(s)}</div></td>
    <td style="white-space:nowrap">${fmtY(s.arrival)} – ${fmt(s.departure)}</td>
    <td>${f?`<button class="link" data-act="famHistory" data-id="${f.id}">${esc(f.name)}</button>${f.phone?`<div class="muted" style="font-size:12.5px">${esc(f.phone)}</div>`:''}`:`<span class="tag red">${t('Sin familia')}</span>`}</td>
    <td>${stayStatus(s)}</td>
    <td>${s.review?`<button class="link" data-act="review" data-id="${s.id}">${starsHTML(reviewAvg(s.review))}</button>`:f?`<button class="btn small ${s.departure<d?'primary':''}" data-act="review" data-id="${s.id}">${t('Valorar')}</button>`:'—'}</td></tr>`; };
  return head + `<div class="assign"><div class="stu-list">${tutors.map(x=>{ const p = pendingReviews().filter(s=>s.tutorId===x.id).length;

function timelineHTML(fams){
  const start = parse(ui.tlStart), end = new Date(start.getFullYear(), start.getMonth()+4, 1);
  const total = Math.round((end-start)/864e5), sKey = toKey(start), eKey = toKey(addDays(end,-1));
  const pos = (a,b) => { const from = a<sKey?sKey:a, to = b>eKey?eKey:b; if(to<from) return null;
    return `left:${(parse(from)-start)/864e5/total*100}%;width:${(daysIncl(from,to))/total*100}%`; };
  const months = []; for(let i=0;i<4;i++){ const m = new Date(start.getFullYear(), start.getMonth()+i, 1), n = new Date(start.getFullYear(), start.getMonth()+i+1, 1);
    months.push(`<div style="position:absolute;left:${(m-start)/864e5/total*100}%;width:${(n-m)/864e5/total*100}%;border-left:1px solid var(--line);padding-left:6px">${m.toLocaleDateString(LOC(),{month:'long',year:'numeric'})}</div>`); }
  const d = todayKey(), todayPos = d>=sKey && d<=eKey ? `<div class="tl-today" style="left:${(parse(d)-start)/864e5/total*100}%" title="${t('Hoy')}"></div>` : '';
  const ps = periodsSorted().filter(p=>p.end>=sKey && p.start<=eKey);
  return `<div class="toolbar" style="justify-content:space-between"><div class="legend"><span><i style="background:var(--ok)"></i>${t('Tramo confirmado')}</span><span><i style="background:var(--wait)"></i>${t('Tramo pendiente de confirmar')}</span><span><i style="background:var(--brand-soft);border:1.5px solid var(--brand)"></i>${t('Periodo ofertado')}</span></div>
    <div class="weekbar"><button class="icon-btn" data-act="tlPrev" aria-label="${t('Mes anterior')}">‹</button><strong style="min-width:200px">${fmtY(sKey)} – ${fmtY(eKey)}</strong><button class="icon-btn" data-act="tlNext" aria-label="${t('Mes siguiente')}">›</button><button class="btn small" data-act="tlToday">${t('Hoy')}</button></div></div>
  <div class="panel tl">
    <div class="tl-row"><span></span><div class="tl-months">${months.join('')}</div></div>
    <div class="tl-row"><b style="font-size:13.5px">${t('Periodos')}</b><div class="tl-track periods">${todayPos}${ps.map((p,i)=>{ const st = pos(p.start,p.end); return st?`<div class="tl-period" style="${st};top:${i%2?'17px':'3px'}" title="${esc(periodLabel(p))}">${esc(p.name)}</div>`:''; }).join('')}</div></div>
    ${fams.map(f=>`<div class="tl-row"><button class="link" data-act="famAvail" data-id="${f.id}" style="font-size:14px">${esc(f.name)}</button><div class="tl-track" data-act="famAvail" data-id="${f.id}" style="cursor:pointer">${todayPos}
      ${ps.map(p=>{ const st = pos(p.start,p.end); return st?`<div class="tl-pshade" style="${st}"></div>`:''; }).join('')}
      ${(f.ranges||[]).map(r=>{ const st = pos(r.from,r.to); return st?`<div class="tl-bar ${r.status==='pending'?'pending':''}" style="${st}" title="${fmt(r.from)} – ${fmtY(r.to)} · ${r.status==='yes'?t('Confirmado'):t('Pendiente de confirmar')}"></div>`:''; }).join('')}</div></div>`).join('')}
  </div>`;
}

function armed(el, label){
  if(el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = label;

}

/* ================= Exportar ================= */
/* Guarda un archivo dejando elegir carpeta y nombre cuando el navegador lo permite.
   Devuelve 'picked' (elegido por el usuario), 'cancel' o 'downloaded' (carpeta de descargas). */
/* Intenta abrir el diálogo «Guardar como». Si el navegador o la vista previa no lo permiten, devuelve 'fallback'. */
async function saveFile(name, content, type, ext, desc){
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({suggestedName:name, types:[{description:desc, accept:{[type]:[ext]}}]});
      const w = await handle.createWritable(); await w.write(new Blob([content],{type})); await w.close();
      return 'picked';
    }catch(e){ if(e && e.name==='AbortError') return 'cancel'; }
  }
  return 'fallback';
}
let pendingFile = null;
function openSaveFallback(f){
  pendingFile = f;
  modal.innerHTML = `${mHead(f.title)}
  <div class="m-body" style="display:block">
    <div class="notice">${t('Este navegador no deja elegir la carpeta desde aquí. Prueba a descargar el archivo; si no se descarga (pasa dentro de Teams), cópialo y pégalo.')}</div>
    <div class="row" style="margin-bottom:12px"><button class="btn primary" data-act="fbDownload">${t('Descargar archivo')}</button><button class="btn" data-act="fbCopy">${f.copyLabel}</button></div>
    <label class="f full">${f.hint}<textarea id="fbText" class="mail-body" readonly style="min-height:200px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px">${esc(f.preview)}</textarea></label>
  </div>
  <div class="m-foot"><span></span><button class="btn" data-act="close">${t('Cerrar')}</button></div>`;
  showM();
}
async function copyText(text, area){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{ area.value = text; area.focus(); area.select(); if(document.execCommand('copy')) return true; }catch(e){}
  return false;
}
function download(name, content, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content],{type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

function applyBackup(d){
  if(!d || !Array.isArray(d.families) || !Array.isArray(d.students)) throw new Error('invalid');
  state = fromData(d); migrate(); syncStays(); ui.periodId = null; save(); render(); toast(t('Copia restaurada'));
}

/* --- Normalización de respuestas --- */
const hnorm = s => norm(s).replace(/[^a-z0-9]+/g,' ').trim();
const META = ['id','start time','completion time','email','name','last modified time','hora de inicio','hora de finalizacion','correo electronico','nombre','hora de la ultima modificacion'];
const isYes = v => { const x = String(v||'').trim(); return /^(yes|s[ií]|true|1|y)(?![a-z])/i.test(x) || /(^|[^a-z])(yes|s[ií])(?![a-z])/i.test(x); };
const splitMulti = v => String(v||'').split(';').map(x=>x.trim()).filter(Boolean);
function importDate(v){
  if(v==null || v==='') return '';
  if(v instanceof Date && !isNaN(v)) return toKey(v);
  if(typeof v==='number') return toKey(addDays(new Date(1899,11,30), Math.floor(v)));
  const s = String(v).trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){ let a = +m[1], b = +m[2], y = +m[3]; if(y<100) y += 2000;
    let d = a, mo = b; if(b>12 && a<=12){ d = b; mo = a; } if(mo>12) return ''; return `${y}-${pad(mo)}-${pad(d)}`; }
  return '';
}
function dietFrom(v){ const s = norm(v);
  if(/vegan/.test(s)) return 'vegana'; if(/veget/.test(s)) return 'vegetariana'; if(/gluten/.test(s)) return 'sin gluten';
  if(/lact/.test(s)) return 'sin lactosa'; if(/halal/.test(s)) return 'halal'; if(/kosher/.test(s)) return 'kosher'; return 'ninguna'; }
function genderFrom(v){ const s = norm(v); if(/girl|chica|female|mujer/.test(s)) return 'chica'; if(/boy|chico|male|hombre/.test(s)) return 'chico'; return 'otro'; }
function kidsFrom(v){ const s = norm(v); if(/^s[ií]$|^yes$/.test(s)) return 'si'; if(/^no$/.test(s)) return 'no'; if(/rather not|que no/.test(s)) return 'no'; if(/no preference|igual|indiferente/.test(s)) return 'indiferente'; if(/like|que haya/.test(s)) return 'si'; return 'indiferente'; }
function prioFrom(v){ const out = []; splitMulti(v).forEach(x=>{ const n = norm(x); const p = PRIOS().find(([k,,label])=>label.split(' / ').some(l=>n.includes(norm(l)))); if(p && !out.includes(p[0])) out.push(p[0]); }); return out; }
function famGenderFrom(v){ const s = norm(v); if(/girls only|solo chicas/.test(s)) return 'chica'; if(/boys only|solo chicos/.test(s)) return 'chico'; return 'indiferente'; }
const simpleHash = s => { let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; } return (h>>>0).toString(36); };

/* --- Lectura de archivos y texto pegado --- */
const libs = {};
const loadLib = src => libs[src] || (libs[src] = new Promise((res,rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>{ delete libs[src]; rej(new Error('lib')); }; document.head.appendChild(s); }));
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const QR_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
function parseDelimited(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length) return [];
  const first = lines[0], delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cur = '', q = false; const src = lines.join('\n');
  for(let i=0;i<src.length;i++){ const c = src[i];
    if(q){ if(c==='"' && src[i+1]==='"'){ cur += '"'; i++; } else if(c==='"') q = false; else cur += c; }
    else if(c==='"') q = true; else if(c===delim){ row.push(cur); cur = ''; } else if(c==='\n'){ row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c; }
  row.push(cur); rows.push(row);
  const head = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(x=>String(x).trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h, (r[i]??'').trim()])));
}
async function readSheet(file){
  const isCsv = /\.(csv|txt)$/i.test(file.name);
  try{
    await loadLib(XLSX_SRC);
    const wb = window.XLSX.read(await file.arrayBuffer(), {type:'array'});
    const kidsSheet = wb.SheetNames.find(n=>/^(hijos|children)$/i.test(n.trim()));
    if(importCtx) importCtx.extra = kidsSheet ? {kids:window.XLSX.utils.sheet_to_json(wb.Sheets[kidsSheet], {defval:'', raw:true})} : null;
    return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:true});
  }catch(e){
    if(isCsv) return parseDelimited(await file.text());
    throw new Error(t('No se ha podido leer el Excel (hace falta conexión a internet). Guárdalo como CSV o copia las filas y pégalas.'));
  }
}

function autoMap(headers, qs){
  const map = {};
  qs.forEach(([k,title,,,,aliases])=>{
    const full = hnorm(title), parts = title.split(' / ').map(hnorm);
    let h = (aliases||[]).map(hnorm).map(a=>headers.find(x=>hnorm(x)===a) || headers.find(x=>hnorm(x).startsWith(a+' '))).find(Boolean);
    if(!h) h = headers.find(x=>hnorm(x)===full);
    if(!h) h = headers.find(x=>{ const n = hnorm(x); return !META.includes(n) && parts.some(pp=>pp.length>2 && (n===pp || n.startsWith(pp+' ') || n.includes(pp))); });
    map[k] = h || '';
  });
  return map;
}

function acceptItem(it){
  const d = it.data;
  if(it.type==='student'){
    if(!periodById(it.periodId)) return false;
    const fields = {name:d.name, firstName:d.firstName ?? splitName(d.name).firstName, lastName:d.lastName ?? splitName(d.name).lastName, nameAuto:false, email:d.email, age:d.age, dob:d.dob||'', ...(d.docId?{docId:d.docId, docType:d.docType||''}:{}), gender:d.gender, country:d.country, language:d.language, school:d.school, sek:d.sek, course:d.course,
      petAllergy:d.petAllergy, foodAllergies:d.foodAllergies, diet:d.diet, kidsPref:d.kidsPref, smokeFree:d.smokeFree, priorities:d.priorities, extendRequested:d.extendRequested, notes:d.notes, interests:d.interests||[], ownRoom:!!d.ownRoom, stayType:d.stayType||''};
    const same = it.match && staysOf(it.match).find(s=>s.periodId===it.periodId);
    if(same){ Object.entries(fields).forEach(([k,v])=>{ if(v!=='' && v!=null && !(Array.isArray(v) && !v.length)) same[k] = v; }); if(d.tutorId) same.tutorId = d.tutorId; }
    else { const prev = it.match ? staysOf(it.match).slice(-1)[0] : null;
      const n = {id:uid(), ...fields, periodId:it.periodId, familyId:null, tutorId:d.tutorId||prev?.tutorId||null, source:'form'}; if(it.match) n.personId = it.match; state.students.push(n); }
    syncStays();
  } else {
    let f = it.match && famById(it.match);
    const nr = famNewRanges(f, d);
    const fields = {};
    Object.entries(d).forEach(([k,v])=>{ if(['periodIds','ranges'].includes(k) || v===undefined || v==='' || v===null) return; if(Array.isArray(v) && !v.length) return; fields[k] = v; });
    if(fields.smokeLevel) fields.smokers = fields.smokeLevel==='dentro';
    if(fields.children) fields.kids = '';
    if(f) Object.assign(f, fields);
    else { f = {id:uid(), distance:'', capacity:1, kids:'', petsDesc:'', diets:[], ranges:[], ...fields}; state.families.push(f); }
    f.ranges = [...(f.ranges||[]), ...nr.map(r=>({id:uid(), from:r.from, to:r.to, status:'yes'}))];
  }

  state.inbox = state.inbox.filter(x=>x.id!==it.id);

}

function emptyDoc(){ return {app:'acogida', version:2, cols:Object.fromEntries(COLS.map(c=>[c,[]])), deleted:Object.fromEntries(COLS.map(c=>[c,{}])),

function normalizeDoc(d){

/* Marca con fecha y autor las fichas cambiadas, creadas o borradas desde la última sincronización */
function stampLocal(){
  if(!base) return false;
  const now = Date.now(); let dirty = false;
  COLS.forEach(c=>{
    tombs[c] = tombs[c] || {};
    const bm = new Map((base.cols[c]||[]).map(r=>[r.id,r]));
    (state[c]||[]).forEach(r=>{ const b = bm.get(r.id); if(!b || stripMeta(b)!==stripMeta(r)){ r._base = b ? (b._u||0) : 0; r._u = now; r._by = userName; dirty = true; } });
    const ids = new Set((state[c]||[]).map(r=>r.id));
    bm.forEach((b,id)=>{ if(!ids.has(id)){ tombs[c][id] = {_u:now, _by:userName}; dirty = true; } });
  });
  if(JSON.stringify(state.mail||{}) !== JSON.stringify(base.meta.mail||{})){ metaU.mail = now; dirty = true; }
  if((state.familyFormUrl||'') !== (base.meta.familyFormUrl||'')){ metaU.ff = now; dirty = true; }
  if(JSON.stringify(state.importedKeys||[]) !== JSON.stringify(base.meta.importedKeys||[])) dirty = true;

/* Une dos versiones ficha a ficha: gana el cambio más reciente; los borrados se respetan */
function mergeDocs(a, b){
  const out = emptyDoc(), old = Date.now() - 180*864e5;
  COLS.forEach(c=>{
    const del = {...(a.deleted[c]||{})};
    Object.entries(b.deleted[c]||{}).forEach(([id,tb])=>{ if(!del[id] || del[id]._u < tb._u) del[id] = tb; });
    const recs = new Map();
    [...(a.cols[c]||[]), ...(b.cols[c]||[])].forEach(r=>{ const cur = recs.get(r.id); if(!cur || (r._u||0) > (cur._u||0)) recs.set(r.id, r); });
    out.cols[c] = [...recs.values()].filter(r=>!(del[r.id] && del[r.id]._u >= (r._u||0)));

}
const recLabel = (c, r) => c==='families' ? t('Familia {n}',{n:r.name||''}) : c==='inbox' ? t('Solicitud de {n}',{n:(r.data&&r.data.name)||''}) : (r.name || r.id);
function detectConflicts(local, remote){

  COLS.forEach(c=>{
    const bm = new Map((base.cols[c]||[]).map(r=>[r.id,r])), rm = new Map((remote.cols[c]||[]).map(r=>[r.id,r]));
    (local.cols[c]||[]).forEach(l=>{ const b = bm.get(l.id), r = rm.get(l.id); if(!b || !r) return;
      const mine = (l._u||0) > (b._u||0), theirs = (r._u||0) > (b._u||0) && r._by !== userName;
      if(mine && theirs && stripMeta(l) !== stripMeta(r)){
        const lost = (l._u||0) > (r._u||0) ? r : l;
        syncConflicts.unshift({col:c, id:l.id, label:recLabel(c,l), other:r._by, at:Date.now(), lostMine:lost===l, lost:clone(lost)});
        conflictBar(t('{n} también ha cambiado «{r}». Se ha quedado la versión más reciente.',{n:r._by, r:recLabel(c,l)}));
      } });
  });
  COLS.forEach(c=>{
    const bm = new Map((base.cols[c]||[]).map(r=>[r.id,r])), lm = new Map((local.cols[c]||[]).map(r=>[r.id,r]));
    (remote.cols[c]||[]).forEach(r=>{ const b = bm.get(r.id), l = lm.get(r.id); if(!b || !l) return;
      if(b._by===userName && r._by && r._by!==userName && (r._u||0) > (b._u||0) && (l._u||0)===(b._u||0) && (r._base||0)!==(b._u||0) && stripMeta(b)!==stripMeta(r)){
        syncConflicts.unshift({col:c, id:r.id, label:recLabel(c,r), other:r._by, at:Date.now(), lostMine:true, lost:clone(b)});

async function syncNow(){

  if(syncing){ syncAgain = true; return; }
  syncing = true; syncErr = ''; updateSyncStatus();
  try{
    stampLocal();
    const fh = await dirHandle.getFileHandle(SHARED_FILE, {create:true});
    const file = await fh.getFile();
    let remote = emptyDoc();
    if(file.size){ try{ remote = normalizeDoc(JSON.parse(await file.text())); }catch(e){ throw new Error(t('El archivo de datos de la carpeta está dañado o a medio sincronizar. Vuelve a intentarlo en un momento.')); } }
    const extras = [];
    for await (const [name, h] of dirHandle.entries()){ if(h.kind==='file' && name!==SHARED_FILE && /^acogida-datos.*\.json$/i.test(name)) extras.push([name, h]); }
    for(const [, h] of extras){ try{ remote = mergeDocs(remote, normalizeDoc(JSON.parse(await (await h.getFile()).text()))); }catch(e){} }
    const before = localDoc(), beforeKey = docKey(before);

    if(docKey(merged) !== docKey(remote) || extras.length){

}

const monById = id => (state.monitors||[]).find(m=>m.id===id);
const schoolKey = s => norm(s).replace(/[^a-z0-9]+/g,'');
const sameSchool = (a,b) => !!schoolKey(a) && schoolKey(a)===schoolKey(b);
const allGuests = () => [...state.students, ...(state.monitors||[])];
/* Alumnos y monitores que coinciden en fechas con una estancia, en una familia */
const guestsAt = (f, span, exceptId) => allGuests().filter(g => g.id!==exceptId && g.familyId===f.id && overlaps(g, span));
function evaluateMonitor(m, f){
  const blocks = [], pros = [], cons = []; let score = 50;
  const cov = coverage(f, m.arrival, m.departure);
  if(cov==='no') blocks.push(t('No tiene disponibilidad en esas fechas'));
  else if(cov==='partial') blocks.push(t('Su disponibilidad no cubre toda la estancia'));
  else if(cov==='yes'){ score += 10; pros.push(t('Disponible toda la estancia')); }
  else { score -= 10; cons.push(t('Fechas pendientes de confirmar')); }
  const here = guestsAt(f, m, m.id), cap = Number(f.capacity)||1;
  if(here.length >= cap) blocks.push(t('Sin plazas libres ({b}/{c} ocupadas)',{b:here.length,c:cap}));
  const studs = here.filter(g=>!g.role), mons = here.filter(g=>g.role==='monitor');
  const own = studs.filter(s=>sameParty(s, m)), other = studs.filter(s=>!sameParty(s, m));
  if(!own.length) blocks.push(t('No acoge a ningún alumno de su colegio en esas fechas'));
  else { score += 20 + Math.min(10, own.length*5); pros.push(t('Acoge a {n} de sus alumnos: {l}',{n:own.length, l:own.map(s=>s.name).join(', ')})); }
  if(other.length) blocks.push(t('Acoge a alumnos de otro colegio en esas fechas: {l}',{l:other.map(s=>`${s.name} (${s.school||'—'})`).join(', ')}));
  const otherMon = mons.filter(x=>!sameParty(x, m));
  if(otherMon.length) blocks.push(t('Ya aloja a un monitor de otro colegio: {l}',{l:otherMon.map(x=>x.name).join(', ')}));
  else if(mons.length) cons.push(t('Ya aloja a otro monitor del mismo colegio'));
  if(m.petAllergy && f.pets && f.petWhere!=='fuera' && !((f.petTypes||[]).length && f.petTypes.every(x=>x==='otros'))) blocks.push(t('Tiene mascotas y el monitor es alérgico'));
  if(m.diet && m.diet!=='ninguna' && !(f.diets||[]).includes(m.diet)) blocks.push(t('No ofrece dieta {d}',{d:dietLabel(m.diet)}));
  const sl = smokeLevel(f);
  if(m.smokeFree && sl==='dentro') blocks.push(t('Hay fumadores en casa')); else if(m.smokeFree && sl==='fuera') cons.push(t('Alguien fuma o vapea fuera de casa'));
  if(m.ownRoom && (f.roomType==='compartida'||f.roomType==='litera')){ score -= 15; cons.push(t('El monitor necesita habitación individual y la de la familia es compartida')); }
  else if(f.roomType==='individual'){ score += 5; pros.push(t('Habitación individual')); }
  if(f.ownBath){ score += 3; pros.push(t('Baño propio')); }
  allergyNeeds(m.foodAllergies).forEach(a=>{ const ok = f.allergiesOk||[]; if(a!=='otra' && ok.includes(a)) pros.push(t('Pueden atender la alergia: {a}',{a:optLabel(ALLERGIES(),a)})); else cons.push(t('Confirmar con la familia la alergia: {a}',{a: a==='otra'?m.foodAllergies:optLabel(ALLERGIES(),a)})); });
  return {ok:!blocks.length, score:Math.max(0,Math.min(100,score)), blocks, pros, cons, pendingDates:cov==='pending'};
}
/* Regla para alumnos: una familia con un monitor de otro colegio no puede acoger al alumno */
function monitorBlockFor(st, f){
  const mons = (state.monitors||[]).filter(m=>m.familyId===f.id && overlaps(m, st) && !sameParty(m, st));
  return mons.length ? t('Aloja a un monitor de otro colegio en esas fechas: {l}',{l:mons.map(m=>`${m.name} (${m.school||'—'})`).join(', ')}) : '';
}
function monitorConflicts(){
  const out = [];
  (state.monitors||[]).filter(m=>m.familyId && m.familyId!==RES_ID && m.departure>=todayKey()).forEach(m=>{
    const f = famById(m.familyId);
    if(!f){ out.push({mon:m, level:'error', text:t('La familia asignada ya no existe')}); return; }
    const ev = evaluateMonitor(m, f);
    if(!ev.ok) out.push({mon:m, f, level:'error', text:ev.blocks.join(' · ')});
    else if(ev.pendingDates) out.push({mon:m, f, level:'warn', text:t('La familia aún no ha confirmado todas las fechas')});
  });
  return out;
}

function batchBuild(){
  const headers = Object.keys(importCtx.rows[0]), m = importCtx.map;
  return importCtx.rows.map((r,i)=>{
    const {data, warn} = buildItem(r, headers); const out = {i:i+2, data, warn:[...warn], error:''};
    if(importCtx.type==='student'){
      if(m.sek) data.sek = sekFrom(r[m.sek]);
      data.periodId = (m.period && periodFrom(r[m.period])) || importCtx.periodId || '';
      if(m.period && r[m.period] && !periodFrom(r[m.period])){ out.badPeriod = String(r[m.period]).trim();
        out.warn.push(importCtx.periodId ? t('Periodo no reconocido: {p} → se usa {u}',{p:out.badPeriod, u:periodById(importCtx.periodId)?.name||''}) : t('Periodo no reconocido: {p}',{p:out.badPeriod})); }

      if(!data.name) out.error = t('Falta el nombre');
      else if(/^(tbc|tbd|por confirmar|pending)$/i.test(String(data.firstName||data.name).trim()) || /^(tbc|tbd)$/i.test(String(data.lastName||'').trim())) out.error = t('Nombre por confirmar (TBC)');
      else if(!data.periodId) out.error = t('Sin periodo');
      if(m.docId && String(r[m.docId]??'').trim()){ data.docId = String(r[m.docId]).toUpperCase().replace(/\s+/g,''); data.docType = docTypeFrom(m.docType ? r[m.docType] : '', data.docId); }
      out.match = (data.docId && (state.students.find(x=>x.docId && x.docId===data.docId) ? personKey(state.students.find(x=>x.docId===data.docId)) : '')) || (data.name ? matchStudent(data) : '');
      out.same = out.match && staysOf(out.match).find(s=>s.periodId===data.periodId);
      out.shareRaw = m.share ? String(r[m.share]??'').trim() : '';
      out.groupCode = m.group ? String(r[m.group]??'').trim().toUpperCase() : '';
    } else {
      if(!data.name) out.error = t('Faltan los apellidos de la familia');
      out.match = data.name ? matchFamily(data) : '';
    }
    out.warn = out.warn.filter(w=>w!==t('Falta el nombre') && w!==t('Faltan los apellidos de la familia'));
    return out;
  });
}
function batchShareMatches(items){

    const pool = [...items.map((y, j)=>({key:'r'+j, name:y.data.name, periodId:y.data.periodId, ok:!y.error})).filter(y=>y.ok && y.periodId===x.data.periodId),

    splitRequests(x.shareRaw).forEach(q=>{ const b = bestPerson(q, pool, 'r'+k); const hit = b && b.s>=.55 ? pool.find(p=>p.key===b.key) : null;
      out.push({from:'r'+k, fromName:x.data.name, q, to:hit?hit.key:'', toName:hit?hit.name:'', s:b?b.s:0, existing:!!(hit && hit.existing)}); });
  });

}

function batchImport(){
  const upd = document.getElementById('batchUpdate').checked, isFam = importCtx.type==='family';
  let created = 0, updated = 0, skipped = 0;

  document.querySelectorAll('.bs_ok').forEach(c=>{ if(!c.checked) importCtx.shareMatches[Number(c.dataset.i)].to = ''; });
  importCtx.items.forEach((x, k)=>{ if(x.error) return;
    const exists = isFam ? !!x.match : !!x.same;
    if(exists && !upd){ skipped++; if(!isFam) idOf['r'+k] = x.same.id; return; }
    acceptItem({key:'lote|'+uid(), type:importCtx.type, periodId:x.data.periodId||null, data:x.data, warn:x.warn, match:x.match||''});
    exists ? updated++ : created++;
    if(!isFam){ const st = state.students.find(s=>s.periodId===x.data.periodId && ((x.data.email && s.email===x.data.email) || norm(s.name)===norm(x.data.name)));
      if(st){ idOf['r'+k] = st.id; if(x.shareRaw) st.shareRaw = x.shareRaw;
        if(x.groupCode){ state.groups = state.groups||[]; let g = state.groups.find(gg=>norm(gg.code)===norm(x.groupCode));
          if(!g){ g = {id:uid(), code:x.groupCode, school:st.school||'', periodId:st.periodId, notes:''}; state.groups.push(g); }
          st.groupId = g.id; }
        else if(importCtx.groupId && groupById(importCtx.groupId)){ const g = groupById(importCtx.groupId); st.groupId = g.id; if(g.school) st.school = g.school; } } }
  });
  if(!isFam) (importCtx.shareMatches||[]).filter(x=>x.to).forEach(x=>{ const a = stuById(idOf[x.from]), b = stuById(x.existing ? x.to : idOf[x.to]); if(!a || !b || a===b) return;
    a.shareWith = a.shareWith||[]; b.shareWith = b.shareWith||[]; if(!a.shareWith.includes(b.id)) a.shareWith.push(b.id); if(!b.shareWith.includes(a.id)) b.shareWith.push(a.id); });
  state.importedKeys = (state.importedKeys||[]).filter(k=>!String(k).startsWith('lote|'));
  modal.close(); save(); render();
  toast(t('{c} creados · {u} actualizados · {s} omitidos',{c:created, u:updated, s:skipped}));

/* Subgrupo de convivencia: alumnos enlazados por «compartir alojamiento» que coinciden en fechas */
function companions(st){
  const seen = new Map([[st.id, st]]), q = [st];
  while(q.length){ const x = q.pop(); (x.shareWith||[]).forEach(id=>{ const y = stuById(id); if(y && !seen.has(y.id) && overlaps(y, st)){ seen.set(y.id, y); q.push(y); } }); }
  return [...seen.values()];
}
const capPrefix = () => t('Sin plazas libres ({b}/{c} ocupadas)',{b:'',c:''}).split('(')[0].trim();
function groupFit(members, f){
  const ids = new Set(members.map(m=>m.id)), blocks = [], cap = Number(f.capacity)||1;
  const here = allGuests().filter(g=>!ids.has(g.id) && g.familyId===f.id && members.some(m=>overlaps(g,m))).length;
  if(here + members.length > cap) blocks.push(t('No hay plazas para los {n} juntos ({h}/{c} ocupadas)',{n:members.length, h:here, c:cap}));
  members.forEach(m=>{ evaluate(m,f).blocks.filter(b=>!b.startsWith(capPrefix())).forEach(b=>blocks.push(`${m.name}: ${b}`)); });
  return blocks;
}

const NAT = {spanish:['Española','España','español'], espanola:['Española','España','español'], irish:['Irlandesa','Irlanda','inglés'], irlandesa:['Irlandesa','Irlanda','inglés'],
  french:['Francesa','Francia','francés'], francesa:['Francesa','Francia','francés'], italian:['Italiana','Italia','italiano'], italiana:['Italiana','Italia','italiano'],
  german:['Alemana','Alemania','alemán'], alemana:['Alemana','Alemania','alemán'], portuguese:['Portuguesa','Portugal','portugués'], portuguesa:['Portuguesa','Portugal','portugués'],
  british:['Británica','Reino Unido','inglés'], english:['Británica','Reino Unido','inglés'], mexican:['Mexicana','México','español'], mexicana:['Mexicana','México','español']};
const natInfo = v => NAT[hnorm(v).split(' ')[0]] || null;
function parseRawDelimited(text){
  const lines = text.replace(/\r/g,''); const first = lines.split('\n')[0]||'';
  const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<lines.length;i++){ const c = lines[i];
    if(q){ if(c==='"' && lines[i+1]==='"'){ cur += '"'; i++; } else if(c==='"') q = false; else cur += c; }
    else if(c==='"') q = true; else if(c===delim){ row.push(cur); cur = ''; } else if(c==='\n'){ row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c; }
  row.push(cur); rows.push(row); return rows;
}
async function readSheetRows(file){
  if(/\.(csv|txt)$/i.test(file.name)) return parseRawDelimited(await file.text());
  try{ await loadLib(XLSX_SRC); const wb = window.XLSX.read(await file.arrayBuffer(), {type:'array'});
    return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:true}); }
  catch(e){ throw new Error(t('No se ha podido leer el Excel (hace falta conexión a internet). Guárdalo como CSV o copia las filas y pégalas.')); }
}
function simil(a,b){
  a = hnorm(a); b = hnorm(b); if(!a || !b) return 0; if(a===b) return 1;
  const bg = s => { const o = []; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; };
  const A = bg(a), B = bg(b); let m = 0; A.forEach(x=>{ const k = B.indexOf(x); if(k>=0){ m++; B.splice(k,1); } });
  return 2*m/(A.length + bg(b).length);
}
function bestPerson(q, people, selfKey){
  const qn = hnorm(q), qt = qn.split(' ').filter(w=>w.length>2); let best = null;
  people.forEach(p=>{ if(p.key===selfKey) return; const pn = hnorm(p.name), pt = pn.split(' ');
    let s = simil(qn, pn); if(qt.length) s = Math.max(s, qt.filter(w=>pt.includes(w)).length/qt.length * (qt.length>=2 ? .95 : .7));
    const qf = qn.split(' ')[0], pf = pt[0];
    if(qf && qf===pf) s += .15; else if(qf && people.some(o=>hnorm(o.name).split(' ')[0]===qf)) s *= .6;
    if(!best || s > best.s) best = {key:p.key, name:p.name, s}; });
  return best;
}
const splitRequests = v => String(v||'').split(/,|;|\n|\/|\s+y\s+|\s+and\s+|\s+&\s+|\s+-\s+|^\s*-\s*/i).map(x=>x.trim().replace(/^[-.\s]+|[-.\s]+$/g,'')).filter(x=>x.length>1);
function schoolMedoid(list){
  if(!list.length) return '';
  const best = list.map(x=>[x, list.reduce((n,y)=>n+simil(x,y),0)]).sort((a,b)=>b[1]-a[1] || b[0].length-a[0].length)[0][0].trim();
  return best===best.toUpperCase() ? best.toLowerCase().replace(/(^|[\s(])(\S)/g,(m,a,c)=>a+c.toUpperCase()).replace(/\b(Del|De|La|Las|Los|Y)\b/g,w=>w.toLowerCase()) : best;
}
function parseLK(rows){
  const hi = rows.findIndex(r=>r.some(c=>['name','nombre'].includes(hnorm(c))) && r.some(c=>['surname','surnames','apellidos','apellido'].includes(hnorm(c))));
  if(hi<0) throw new Error(t('No encuentro la fila de títulos (NAME y SURNAME).'));
  const H = rows[hi].map(hnorm), col = (...names) => H.findIndex(h=>names.some(n=>h===n || h.startsWith(n+' ')));
  const C = {name:col('name','nombre'), surname:col('surname','surnames','apellidos','apellido'), id:col('id','dni','passport','pasaporte','documento'), nat:col('nationality','nacionalidad'),
    phone:H.findIndex(h=>/phone|telefono|movil/.test(h)), gender:col('gender','sexo'), dob:col('dob','date of birth','fecha de nacimiento'), allergies:col('allergies','alergias'),
    diseases:col('diseases','medical','enfermedades','informacion medica'), diets:col('diets','diet','dietas','dieta'), share:H.findIndex(h=>/^(compartir|sharing)/.test(h)), school:col('centro escolar','school','colegio'),
    group:col('group','grupo','code','codigo')};
  const data = rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));
  if(C.group<0){ const cand = H.map((h,i)=>i).filter(i=>data.filter(r=>/^[A-Z]{2,6}\d{1,3}$/.test(String(r[i]||'').trim())).length >= Math.max(2, data.length*.5)); if(cand.length) C.group = cand[0]; }
  const people = []; const flags = [];
  data.forEach((r, k)=>{
    const label = String(r[0]||'').trim(), g = i => i>=0 ? r[i] : '', s = i => String(g(i)??'').trim();
    const role = /student|alumn|estudiante/i.test(label) ? 'student' : /teacher|leader|monitor|profesor|guia/i.test(label) ? 'monitor' : (s(C.name) ? 'student' : '');
    if(!role) return;
    const first = s(C.name), last = s(C.surname), tbc = /^tbc$|^tbd$|por confirmar/i.test(first || last) || (!first && !last);
    const name = tbc ? `${label || t('Monitor')} (${t('por confirmar')})` : `${first} ${last}`.trim();
    const allergies = splitMulti(g(C.allergies)), dietsRaw = splitMulti(g(C.diets)), diseases = s(C.diseases);
    const food = [], env = []; let pet = false, diet = 'ninguna'; const dietOther = [];
    allergies.forEach(a=>{ const n = hnorm(a); if(/\bcat\b|\bdog\b|gato|perro/.test(n)) pet = true;
      if(Object.values(ALLERGY_RX).some(rx=>rx.test(n))) food.push(a); else env.push(a); });
    dietsRaw.forEach(d=>{ const n = hnorm(d); if(/allerg|alerg|intoleran/.test(n)) { food.push(d); return; } const dd = dietFrom(d); if(dd!=='ninguna') diet = dd; else dietOther.push(d); });
    if(dietOther.length) flags.push({who:name, text:t('Dieta no reconocida: {d}',{d:dietOther.join(', ')})});
    if(/cheese|cream|milk|dairy|lact|queso|nata|leche|gluten|vegan|vegetar|no comer|no eat/.test(hnorm(diseases))) flags.push({who:name, text:t('La información médica parece incluir datos de dieta: revísala')});
    if(food.some(a=>dietsRaw.includes(a))) flags.push({who:name, text:t('Alergia alimentaria que venía en la columna de dietas: se ha pasado a alergias alimentarias')});
    const ni = natInfo(s(C.nat));
    people.push({key:'p'+k, role, tbc, label, name, firstName:tbc ? name : first, lastName:tbc ? '' : last, docId:s(C.id).toUpperCase(), nationality:ni?ni[0]:s(C.nat), country:ni?ni[1]:'', language:ni?ni[2]:'',
      phone:s(C.phone), gender:/mujer|female|chica|\bf\b/.test(hnorm(s(C.gender))) ? 'chica' : /hombre|male|chico|\bm\b/.test(hnorm(s(C.gender))) ? 'chico' : '',
      dob:importDate(g(C.dob)), petAllergy:pet, envAllergies:env.join('; '), foodAllergies:food.join('; '), diet, medical:diseases, schoolRaw:s(C.school), code:s(C.group), shareRaw:s(C.share)});
  });
  const studs = people.filter(p=>p.role==='student');
  const matches = [];
  studs.forEach(p=>{ splitRequests(p.shareRaw).forEach(q=>{ const b = bestPerson(q, studs, p.key);
    matches.push({from:p.key, fromName:p.name, q, to:b&&b.s>=.55 ? b.key : '', toName:b&&b.s>=.55 ? b.name : '', s:b?b.s:0, ok:!!(b && b.s>=.55)}); }); });
  const codes = [...new Set(people.map(p=>p.code).filter(Boolean))];
  const schools = {}; people.forEach(p=>{ if(p.schoolRaw) schools[p.schoolRaw] = (schools[p.schoolRaw]||0)+1; });
  const nats = new Set(people.map(p=>hnorm(p.nationality)).filter(Boolean));
  return {people, matches, flags, codes, schoolVariants:Object.keys(schools).length, schoolGuess:schoolMedoid(Object.keys(schools)), nationalities:nats.size};
}

function lkImportGo(){
  const code = val('lk_code').toUpperCase(), school = val('lk_school'), p = periodById(lkCtx.periodId);
  if(!code) return formError(t('Indica el código del grupo.'));
  document.querySelectorAll('.lk_ok').forEach(c=>{ if(!c.checked) lkCtx.matches[Number(c.dataset.i)].ok = false; });
  state.groups = state.groups || []; state.monitors = state.monitors || [];
  let g = state.groups.find(x=>norm(x.code)===norm(code));
  if(!g){ g = {id:uid(), code, school, periodId:p.id, notes:''}; state.groups.push(g); } else { g.school = school || g.school; g.periodId = p.id; }
  const idOf = {}; let nNew = 0, nUpd = 0, nMon = 0, nFixed = 0;
  lkCtx.people.forEach(pp=>{
    const base = {name:pp.name, firstName:pp.firstName, lastName:pp.lastName, nameAuto:false, docId:pp.docId, docType:docTypeFrom('', pp.docId), nationality:pp.nationality, gender:pp.gender, dob:pp.dob, petAllergy:pp.petAllergy, envAllergies:pp.envAllergies,
      foodAllergies:pp.foodAllergies, diet:pp.diet, medical:pp.medical, school:school || pp.schoolRaw, schoolRaw:pp.schoolRaw, groupId:g.id, periodId:p.id, arrival:p.start, departure:p.end};
    if(pp.country) base.country = pp.country; if(pp.language) base.language = pp.language;
    const clean = o => Object.fromEntries(Object.entries(o).filter(([,v])=>v!=='' && v!=null));
    if(pp.role==='monitor'){
      const wrong = state.students.filter(st=>st.periodId===p.id && (pp.tbc ? /^(tbc|tbd)\b/i.test(String(st.firstName||st.name).trim()) : ((pp.docId && st.docId===pp.docId) || norm(st.name)===norm(pp.name))));
      if(wrong.length){ const ids = new Set(wrong.map(x=>x.id)); state.students = state.students.filter(x=>!ids.has(x.id)); state.students.forEach(x=>{ if(x.shareWith) x.shareWith = x.shareWith.filter(i=>!ids.has(i)); }); nFixed += wrong.length; }
      const ex = !pp.tbc && state.monitors.find(m=>m.periodId===p.id && ((pp.docId && m.docId===pp.docId) || norm(m.name)===norm(pp.name)));
      const m = {role:'monitor', ...clean(base), phone:pp.phone, tbc:pp.tbc, smokeFree:true, ownRoom:true};
      if(ex) Object.assign(ex, m); else { state.monitors.push({id:uid(), familyId:null, notes:'', ...m}); nMon++; }
      return;
    }
    const prev = state.students.find(s=>(pp.docId && s.docId===pp.docId)) || state.students.find(s=>norm(s.name)===norm(pp.name));
    const pk = prev ? personKey(prev) : '', same = pk && staysOf(pk).find(s=>s.periodId===p.id);
    if(same){ Object.assign(same, clean(base), {petAllergy:pp.petAllergy, envAllergies:pp.envAllergies, foodAllergies:pp.foodAllergies, diet:pp.diet, medical:pp.medical}); idOf[pp.key] = same.id; nUpd++; }
    else { const n = {id:uid(), familyId:null, sek:prev?.sek||'', course:prev?.course||'', kidsPref:'indiferente', smokeFree:true, notes:'', tutorId:prev?.tutorId||null, ...clean(base), shareWith:[]};
      if(pk) n.personId = pk; state.students.push(n); idOf[pp.key] = n.id; nNew++; }
  });
  lkCtx.people.filter(pp=>pp.role==='student').forEach(pp=>{ const s = stuById(idOf[pp.key]); if(s){ s.shareRaw = pp.shareRaw; s.shareWith = s.shareWith || []; } });
  lkCtx.matches.filter(m=>m.ok && idOf[m.from] && idOf[m.to]).forEach(m=>{ const a = stuById(idOf[m.from]), b = stuById(idOf[m.to]);
    if(!a.shareWith.includes(b.id)) a.shareWith.push(b.id); b.shareWith = b.shareWith||[]; if(!b.shareWith.includes(a.id)) b.shareWith.push(a.id); });
  syncStays(); modal.close(); ui.view = 'grupos'; save(); render();
  toast(t('Grupo {c}: {n} alumnos nuevos, {u} actualizados, {m} monitores',{c:code, n:nNew, u:nUpd, m:nMon}) + (nFixed ? ' · ' + pl(nFixed, t('{n} profesor que estaba como alumno pasa a monitor'), t('{n} profesores que estaban como alumnos pasan a monitores')) : ''));
}

function residenceUse(span, exceptIds){

function residenceFit(members){

const DOC_TYPES = () => [['',t('Sin indicar')],['dni','DNI'],['nie','NIE'],['pasaporte',t('Pasaporte')],['otro',t('Otro')]];
const docTypeLabel = k => (DOC_TYPES().find(x=>x[0]===k)||[])[1] || '';
function docTypeFrom(type, num){
  const ty = norm(type); if(/pasap|passport/.test(ty)) return 'pasaporte'; if(/\bnie\b/.test(ty)) return 'nie'; if(/dni|nif|national id/.test(ty)) return 'dni'; if(ty) return 'otro';
  const n = String(num||'').toUpperCase().replace(/[\s-]/g,''); if(!n) return '';
  if(/^\d{8}[A-Z]$/.test(n)) return 'dni'; if(/^[XYZ]\d{7}[A-Z]$/.test(n)) return 'nie'; return '';
}

function nameReviewList(){

  (state.tutors||[]).forEach(x=>{ if(x.nameAuto) out.push({kind:'tutor', x}); });
  return out;
}

const _openMonitor = openMonitor; openMonitor = function(id, ...a){ markEditing('monitors', id); return _openMonitor(id, ...a); };
const _openTutor = openTutor; openTutor = function(id, ...a){ markEditing('tutors', id); return _openTutor(id, ...a); };
const _openGroup = openGroup; openGroup = function(id, ...a){ markEditing('groups', id); return _openGroup(id, ...a); };
const META_KEYS = new Set(['_u','_by','_base']);
const fieldLabel = k => ({name:t('Nombre'), firstName:t('Nombre'), lastName:t('Apellidos'), phone:t('Teléfono'), phone2:t('Teléfono 2'), email:t('Correo'), notes:t('Notas internas'),
  capacity:t('Plazas'), address:t('Dirección'), ranges:t('Disponibilidad'), familyId:t('Familia'), periodId:t('Periodo'), tutorId:t('Tutor de seguimiento')})[k] || k;
['saveFamily','saveStudent','saveMonitor','saveTutor','saveGroup'].forEach(k=>{
  const orig = actions[k]; if(!orig) return;
  actions[k] = async (id, el) => {
    const ed = editing && id && editing.id===id ? editing : null;
    let theirs = null;
    if(store==='shared' && ed){
      try{ await syncNow(); }catch(e){}
      const rec = (state[ed.col]||[]).find(x=>x.id===id);
      if(rec && (rec._u||0) > ed.u && rec._by && rec._by!==userName) theirs = clone(rec);
    }
    const r = orig(id, el);
    if(theirs){
      const now = (state[ed.col]||[]).find(x=>x.id===id);
      if(now){
        const same = (a,b) => JSON.stringify(a??null)===JSON.stringify(b??null), snap = ed.snap;
        const keys = [...new Set([...Object.keys(snap), ...Object.keys(now), ...Object.keys(theirs)])].filter(x=>!META_KEYS.has(x));
        const mine = keys.filter(x=>!same(now[x], snap[x])), their = keys.filter(x=>!same(theirs[x], snap[x]));
        const keep = their.filter(x=>!mine.includes(x)), clash = their.filter(x=>mine.includes(x) && !same(now[x], theirs[x]));
        keep.forEach(x=>{ now[x] = clone(theirs[x]); });
        if(clash.length) syncConflicts.unshift({col:ed.col, id, label:recLabel(ed.col, now), other:theirs._by, at:Date.now(), lostMine:false, lost:theirs});
        save(); render();
        conflictBar(clash.length
          ? t('{n} también cambió esta ficha mientras la editabas. Se han combinado los cambios; en {f} se ha quedado el tuyo (puedes recuperar el suyo en Equipo).',{n:theirs._by, f:clash.map(fieldLabel).join(', ')})
          : t('{n} también cambió esta ficha mientras la editabas. Se han combinado los cambios de los dos.',{n:theirs._by}));
      }
    }
    editing = null; return r;
  };
});
Object.assign(actions, {
  confBarSee: () => { document.getElementById('confBar')?.remove(); openTeamSettings(); },
  confBarClose: () => document.getElementById('confBar')?.remove()
});

/* ---- Alergias: alimentarias, ambientales y animales ---- */
function splitAllergies(txt, pet){
  const parts = splitMulti(txt), food = [], env = []; let p = !!pet;
  parts.forEach(a=>{ const n = norm(a); if(/\bcat\b|\bdog\b|gato|perro|animal|pet\b|mascota/.test(n)) p = true;
    if(Object.values(ALLERGY_RX).some(rx=>rx.test(n))) food.push(a); else env.push(a); });
  return {foodAllergies:food.join('; '), envAllergies:env.join('; '), petAllergy:p};
}
/* ---- ¿Es una LK Group List? ---- */
function looksLikeLK(rows){
  const keys = Object.keys(rows[0]||{}).map(hnorm), first = rows.map(r=>String(Object.values(r)[0]||''));
  return (keys.includes('surname') && keys.includes('name')) || first.some(v=>/^(teacher|lk leader|student\s*\d)/i.test(v.trim()));
}
/* ---- Unir alumnos existentes a un grupo ---- */
function openGroupLink(gid){
  const g = groupById(gid), cand = state.students.filter(s=>(!g.periodId || s.periodId===g.periodId) && s.groupId!==g.id)
    .map(s=>({s, sc: s.school && g.school ? simil(s.school, g.school) : 0})).sort((a,b)=>b.sc-a.sc || a.s.name.localeCompare(b.s.name));
  modal.innerHTML = `${mHead(t('Unir alumnos al grupo {c}',{c:esc(g.code)}))}
  <div class="m-body" style="display:block">
    <div class="notice">${t('Alumnos del periodo del grupo que aún no están unidos a él. Se marcan los que tienen un colegio parecido a «{s}».',{s:esc(g.school||'')})}</div>
    ${cand.length?`<div class="row" style="margin:10px 0"><button class="btn small" data-act="glAll">${t('Marcar todos')}</button><button class="btn small" data-act="glNone">${t('Desmarcar todos')}</button></div>
    <div class="tbl-wrap" style="max-height:50vh;overflow:auto"><table class="tbl"><thead><tr><th></th><th>${t('Alumno')}</th><th>${t('Colegio de origen')}</th><th>${t('Grupo actual')}</th></tr></thead><tbody>
      ${cand.map(({s,sc})=>`<tr><td><input type="checkbox" class="gl_ok" value="${s.id}" ${sc>=.45 && !(Number(s.age)>=18) ? 'checked':''}></td><td>${esc(s.name)}${Number(s.age)>=18?` <span class="tag amber">${t('Adulto: ¿es un monitor?')}</span>`:''}</td><td>${esc(s.school||'—')}</td><td>${s.groupId&&groupById(s.groupId)?esc(groupById(s.groupId).code):'—'}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted">${t('No hay alumnos pendientes de unir en el periodo del grupo.')}</p>`}
  </div>
  <div class="m-foot"><button class="btn" data-act="close">${t('Cancelar')}</button>${cand.length?`<button class="btn primary" data-act="glSave" data-id="${g.id}">${t('Unir los marcados')}</button>`:''}</div>`;
  showM();
}
Object.assign(actions, {
  groupLink: id => openGroupLink(id),
  glAll: () => document.querySelectorAll('.gl_ok').forEach(c=>c.checked = true),
  glNone: () => document.querySelectorAll('.gl_ok').forEach(c=>c.checked = false),
  glSave: id => { const g = groupById(id), ids = [...document.querySelectorAll('.gl_ok:checked')].map(c=>c.value);
    ids.forEach(i=>{ const s = stuById(i); if(s){ s.groupId = g.id; if(g.school){ s.schoolRaw = s.schoolRaw || s.school; s.school = g.school; } } });
    modal.close(); save(); render(); toast(pl(ids.length, t('{n} alumno unido al grupo {c}',{c:g.code}), t('{n} alumnos unidos al grupo {c}',{c:g.code}))); },
  stuToMonitor: (id, el) => { if(!armed(el, t('Pulsa otra vez para convertirlo en monitor'))) return;
    const s = stuById(id); if(!s) return;
    const keep = ['name','firstName','lastName','email','gender','school','sek','country','language','periodId','arrival','departure','diet','foodAllergies','envAllergies','petAllergy','smokeFree','notes','groupId','dob','nationality','docId','docType','medical','familyId','age'];
    const m = {id:uid(), role:'monitor', ownRoom:true, phone:'', tbc:/^(tbc|tbd)\b/i.test(String(s.firstName||s.name).trim())};
    keep.forEach(k=>{ if(s[k]!==undefined) m[k] = s[k]; });
    state.monitors = state.monitors||[]; state.monitors.push(m);
    state.students = state.students.filter(x=>x.id!==id); state.students.forEach(x=>{ if(x.shareWith) x.shareWith = x.shareWith.filter(i=>i!==id); });
    if(ui.selected===id) ui.selected = null; modal.close(); save(); render(); toast(t('{n} ahora es monitor',{n:m.name})); }
});
(async () => { await load();
  if(store==='shared-go'){ await initShared(); if(ui.askSeed) openSeedAsk(); return; }
  if(migrate()){ syncStays(); save(); } else syncStays(); render();
  setSaved(store==='none' ? t('Sin almacenamiento: los datos se perderán al cerrar') : state.families.length ? t('Datos cargados de este dispositivo') : ''); })();
